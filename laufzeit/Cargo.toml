[package]
name = "pizza-laufzeit"
version = "0.1.0"
edition = "2021"
description = "Laufzeit für pizzaiolo (pizza → WebAssembly), no_std"
license = "MIT"

[lib]
crate-type = ["cdylib"]
path = "src/lib.rs"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
debug = false
strip = true

[profile.dev]
panic = "abort"

[dependencies]
libm = "0.2"
