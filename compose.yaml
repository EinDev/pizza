# pizza-Playground + eigener Hastebin-Server.
#
# Coolify (Build-Pack "Docker Compose"): Domains pro Service in der UI eintragen,
#   pizza    -> https://pizza.example.com:8080
#   hastebin -> https://paste.example.com:8290
# (Port-Suffix = interner Container-Port, öffentlich bleibt es 443.)
# Die Magic-Variablen SERVICE_URL_<SERVICE>_<PORT> füllt Coolify aus diesen Domains.
#
# Lokal: docker compose -f compose.yaml -f compose.lokal.yaml up --build
#   -> http://localhost:8080 (pizza), http://localhost:8290 (Hastebin)
#
# Keine ports und kein container_name hier – das bricht Coolifys Proxy-Routing.

services:
  pizza:
    build:
      context: .
      args:
        SKIP_TESTS: ${SKIP_TESTS:-1}
        SKIP_EXE: ${SKIP_EXE:-0}
    image: pizza-playground:3.0
    expose:
      - "8080"
    restart: unless-stopped
    environment:
      # Domain dieses Service (wird von Coolify aus der UI-Domain verwaltet)
      SERVICE_URL_PIZZA_8080: /
      # Interner Upstream für /api/teilen (leer = Teilen deaktiviert)
      HASTEBIN_URL: ${HASTEBIN_URL:-http://hastebin:8290}
      # Öffentliche Hastebin-URL für /api/konfig (Warndialog, Rohansicht-Link)
      HASTEBIN_OEFFENTLICH: ${HASTEBIN_OEFFENTLICH:-${SERVICE_URL_HASTEBIN_8290:-}}
      # Nur für externe Hastebin-Dienste mit Token (z. B. hastebin.com); sonst leer
      HASTEBIN_TOKEN: ${HASTEBIN_TOKEN:-}
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8080/healthz"]
      interval: 30s
      timeout: 3s
      start_period: 5s
      retries: 3

  hastebin:
    build:
      context: ./hastebin
    image: pizza-hastebin:77d0a86
    expose:
      - "8290"
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
    environment:
      # Domain dieses Service (wird von Coolify aus der UI-Domain verwaltet)
      SERVICE_URL_HASTEBIN_8290: /
      HOST: 0.0.0.0
      PORT: 8290
      KEY_LENGTH: 10
      # max. Dokumentgröße 256 KB (wie client_max_body_size im pizza-nginx)
      MAX_LENGTH: 262144
      # Anfragen pro Minute und IP (wertet X-Real-IP aus)
      RATE_LIMIT_MAX: ${HASTEBIN_RATE_LIMIT:-60}
      RATE_LIMIT_TIME_WINDOW: 60000
      STORAGE_TYPE: redis
      STORAGE_HOST: redis
      STORAGE_PORT: 6379
      STORAGE_DB: 0
      STORAGE_PASSWORD: ${SERVICE_PASSWORD_REDIS:-pizza-lokal}
      # Ablaufzeit der Dokumente: 90 Tage
      STORAGE_EXPIRE_SECONDS: ${HASTEBIN_ABLAUF_SEKUNDEN:-7776000}
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8290/"]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3

  redis:
    image: redis:8.10.2-alpine3.23
    restart: unless-stopped
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --save
      - "3600 1 300 100"
      - --requirepass
      - ${SERVICE_PASSWORD_REDIS:-pizza-lokal}
    volumes:
      - hastebin-daten:/data
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" --no-auth-warning ping | grep -q PONG"]
      interval: 10s
      timeout: 3s
      start_period: 5s
      retries: 5
    environment:
      REDIS_PASSWORD: ${SERVICE_PASSWORD_REDIS:-pizza-lokal}

volumes:
  hastebin-daten:
