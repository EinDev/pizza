services:
  pizza:
    build:
      context: .
      args:
        SKIP_TESTS: ${SKIP_TESTS:-1}
    image: pizza-playground:3.0
    # Kein ports-Mapping und kein container_name: Coolify routet über seinen Proxy
    # selbst auf den Container. Lokal: docker compose run --service-ports … bzw. eigenes Override.
    expose:
      - "8080"
    restart: unless-stopped
    environment:
      # API-Token von hastebin.com (Toptal); leer = Teilen deaktiviert
      HASTEBIN_TOKEN: ${HASTEBIN_TOKEN:-}
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8080/healthz"]
      interval: 30s
      timeout: 3s
      start_period: 5s
      retries: 3
