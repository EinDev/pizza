# pizza-Playground + interner Teilen-Dienst „Durchreiche“ (PROJEKTE.md §4).
#
# Coolify (Build-Pack "Docker Compose"): nur EINE Domain, für den Service pizza:
#   pizza -> https://pizza.example.com:8080
# (Port-Suffix = interner Container-Port, öffentlich bleibt es 443.)
# durchreiche bekommt keine Domain und ist nur im internen Netz erreichbar.
#
# Lokal: docker compose -f compose.yaml -f compose.lokal.yaml up --build
#   -> http://localhost:8080
#
# Keine ports und kein container_name hier – das bricht Coolifys Proxy-Routing.

services:
  pizza:
    build:
      context: .
      args:
        SKIP_TESTS: ${SKIP_TESTS:-1}
        SKIP_EXE: ${SKIP_EXE:-0}
    image: pizza-playground:3.1
    expose:
      - "8080"
    restart: unless-stopped
    environment:
      # Domain dieses Service (wird von Coolify aus der UI-Domain verwaltet)
      SERVICE_URL_PIZZA_8080: /
      # Interner Upstream für /api/ (leer = Teilen aus, /api/konfig meldet {"teilen":false})
      TEILEN_URL: ${TEILEN_URL:-http://durchreiche:8291}
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8080/healthz"]
      interval: 30s
      timeout: 3s
      start_period: 5s
      retries: 3

  durchreiche:
    build:
      context: ./durchreiche
    image: pizza-durchreiche:1
    expose:
      - "8291"
    restart: unless-stopped
    environment:
      PORT: 8291
      TEILEN_DATEN: /daten
      # Aufbewahrung in Tagen ab der letzten Version (0 = unbegrenzt); /api/konfig meldet den Wert
      TEILEN_ABLAUF_TAGE: ${TEILEN_ABLAUF_TAGE:-90}
      # Speicherdeckel für alle geteilten Dateien zusammen
      TEILEN_SPEICHER_MAX_MB: ${TEILEN_SPEICHER_MAX_MB:-2048}
      # Projektgrenzen (Dateien, Bytes je Datei/Projekt/.pizza/Manifest). nginx begrenzt zusätzlich fest auf
      # 2 MiB je Datei und 64 KiB je Manifest – höhere Werte hier wirken erst mit angepasster nginx.conf.
      TEILEN_MAX_DATEIEN: ${TEILEN_MAX_DATEIEN:-100}
      TEILEN_MAX_DATEI_BYTES: ${TEILEN_MAX_DATEI_BYTES:-2097152}
      TEILEN_MAX_PROJEKT_BYTES: ${TEILEN_MAX_PROJEKT_BYTES:-8388608}
      TEILEN_MAX_PIZZA_BYTES: ${TEILEN_MAX_PIZZA_BYTES:-524288}
      TEILEN_MAX_MANIFEST_BYTES: ${TEILEN_MAX_MANIFEST_BYTES:-65536}
      TEILEN_MAX_VERSIONEN: ${TEILEN_MAX_VERSIONEN:-200}
    volumes:
      - durchreiche-daten:/daten
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8291/healthz"]
      interval: 30s
      timeout: 3s
      start_period: 5s
      retries: 3

volumes:
  durchreiche-daten:
