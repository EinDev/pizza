# Dependabot: hält Zutaten frisch, bevor sie im Kühlschrank matschig werden.
version: 2

updates:
  - package-ecosystem: "npm"
    directory: "/ui"
    schedule: { interval: "weekly", day: "monday" }
    groups:
      codemirror:
        patterns: ["@codemirror/*", "@lezer/*"]
      build:
        patterns: ["esbuild"]
    commit-message: { prefix: "deps(ui)" }

  - package-ecosystem: "npm"
    directories: ["/e2e", "/tests/theke"]
    schedule: { interval: "weekly", day: "monday" }
    groups:
      e2e:
        patterns: ["*"]
    commit-message: { prefix: "deps(e2e)" }

  - package-ecosystem: "cargo"
    directories: ["/host", "/laufzeit"]
    schedule: { interval: "weekly", day: "monday" }
    groups:
      rust:
        patterns: ["*"]
    commit-message: { prefix: "deps(rust)" }

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule: { interval: "weekly", day: "monday" }
    groups:
      actions:
        patterns: ["*"]
    commit-message: { prefix: "deps(ci)" }

  - package-ecosystem: "docker"
    directories: ["/", "/durchreiche"]
    schedule: { interval: "weekly", day: "monday" }
    ignore:
      # Node: nur LTS-Linien. Ungerade Majors werden nie LTS; 26.x ist bis zur
      # LTS-Promotion (Ende Oktober 2026) noch "Current" – dann "26.x" hier streichen.
      - dependency-name: "node"
        versions: ["25.x", "26.x", "27.x", "29.x"]
      # nginx: nur der stable-Zweig (gerade Minor); ungerade Minor = mainline.
      - dependency-name: "nginxinc/nginx-unprivileged"
        versions: ["1.31.x", "1.33.x"]
    commit-message: { prefix: "deps(docker)" }

  - package-ecosystem: "docker-compose"
    directory: "/"
    schedule: { interval: "weekly", day: "monday" }
    commit-message: { prefix: "deps(compose)" }
