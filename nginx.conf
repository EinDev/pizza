# nginx-Konfiguration für den pizza-Playground
# Wird nach /etc/nginx/conf.d/default.conf kopiert (also innerhalb von http { }).
# Basis-Image: nginxinc/nginx-unprivileged (läuft als uid 101, lauscht auf 8080).

server_tokens off;

# --- Laufzeit-Konfiguration aus Umgebungsvariablen -------------------------
# Gerendert aus nginx-teilen.conf.template (resolver, $teilen_upstream).
# Liegt auf /tmp, damit es auch mit read_only-Root-Dateisystem funktioniert.
include /tmp/pizza-env/*.conf;

# --- Echte Client-IP hinter Reverse-Proxy (Coolify/Traefik) ----------------
# Nur privaten Netzen wird X-Forwarded-For geglaubt.
set_real_ip_from  10.0.0.0/8;
set_real_ip_from  172.16.0.0/12;
set_real_ip_from  192.168.0.0/16;
set_real_ip_from  127.0.0.1;
real_ip_header    X-Forwarded-For;
real_ip_recursive on;

# --- Rate-Limits für den Teilen-Dienst (PROJEKTE.md §4.6) ------------------
# Erste Linie; der Dienst zählt dahinter selbst noch einmal (gleitendes Fenster je X-Real-IP).
# Leerer Schlüssel = nicht begrenzt; so trennen die Maps lesende und schreibende Methoden
# in Locations, die beides erlauben.
map $request_method $teilen_lese_key {
    GET     $binary_remote_addr;
    HEAD    $binary_remote_addr;
    default "";
}
map $request_method $teilen_schreib_key {
    GET     "";
    HEAD    "";
    default $binary_remote_addr;
}
# Erstellen/Version/Löschen 10/min (Burst 3) · Manifest lesen 60/min (Burst 20) · fehlend 60/min (Burst 20)
# Blob-PUT 240/min (Burst 120) · Blob-GET 1200/min (Burst 300) – ein Projekt sind bis zu 101 Anfragen.
limit_req_zone $teilen_schreib_key  zone=teilen_schreiben:1m rate=10r/m;
limit_req_zone $teilen_lese_key     zone=teilen_lesen:1m     rate=60r/m;
limit_req_zone $binary_remote_addr  zone=teilen_fehlend:1m   rate=60r/m;
limit_req_zone $teilen_schreib_key  zone=blob_hoch:1m        rate=240r/m;
limit_req_zone $teilen_lese_key     zone=blob_lesen:1m       rate=1200r/m;
limit_req_status 429;
limit_req_log_level warn;

# --- Cache-Header zentral -------------------------------------------------
# Wichtig: add_header steht nur auf Server-Ebene (sonst gehen in Locations
# alle geerbten Header verloren). Deshalb wird Cache-Control hier per map bestimmt.
# Regexe werden in Reihenfolge geprüft: Blobs und feste Versionen (@n) sind unveränderlich,
# aber "private", damit gelöschte Links in keinem geteilten Cache weiterleben.
map $uri $pizza_cache_control {
    default                                   "no-cache";
    "~^/api/blob/[0-9a-f]{64}$"               "private, max-age=31536000, immutable";
    "~^/api/teilen/[0-9A-Za-z]{12}@[0-9]+$"   "private, max-age=31536000, immutable";
    ~^/api/                                   "no-store";
    ~^/bin/.*\.json$                          "no-cache";
    # Host-Binaries tragen einen Inhalts-Hash im Namen → dürfen ewig gecacht werden
    ~^/bin/                                   "public, max-age=31536000, immutable";
    # JS/CSS haben keine versionierten Namen: immer per ETag nachfragen, sonst laufen
    # Worker/Seite nach einem Deploy mit altem Interpreter (veraltete Methoden etc.)
    ~*\.(?:js|css|mjs|wasm)$                  "no-cache";
    ~*\.(?:svg|png|jpe?g|glb|gltf|bin|ico|webp|woff2?)$ "public, max-age=86400";
    ~*\.(?:html|json|pizza|erwartet)$         "no-cache";
}

# Fehlerseiten (404 …) nie cachen
map $status $pizza_cache_header {
    200     $pizza_cache_control;
    206     $pizza_cache_control;
    304     $pizza_cache_control;
    default "no-store";
}

# --- gzip -----------------------------------------------------------------
gzip            on;
gzip_vary       on;
gzip_comp_level 6;
gzip_min_length 512;
gzip_proxied    any;
gzip_types      text/plain text/css text/javascript application/javascript
                application/json image/svg+xml application/manifest+json
                application/wasm    # Herd: glut_bg.wasm 1,9 MB → ~0,7 MB, kern.wasm, laufzeit.wasm
                model/gltf+json model/gltf-binary;   # Modelle (H-K16)

server {
    listen      8080;
    listen      [::]:8080;
    server_name _;

    root  /usr/share/nginx/html;
    index index.html;

    charset       utf-8;
    charset_types text/plain text/css text/javascript application/javascript
                  application/json image/svg+xml;

    # Redirects (z. B. /beispiele -> /beispiele/) relativ, damit Port-Mappings passen
    absolute_redirect off;

    # --- Sicherheits- und Cache-Header (gelten überall, auch für 404) -----
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; worker-src 'self'; connect-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; font-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Frame-Options "DENY" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), interest-cohort=()" always;
    # Cross-Origin-Isolation (SharedArrayBuffer/Atomics für interaktive Eingabe, EINGABE.md §3)
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Embedder-Policy "require-corp" always;
    add_header Cross-Origin-Resource-Policy "same-origin" always;
    add_header Cache-Control $pizza_cache_header always;

    # --- Healthcheck --------------------------------------------------------
    location = /healthz {
        access_log   off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # --- Teilen über den internen Dienst Durchreiche (nicht öffentlich erreichbar)
    # proxy_pass $teilen_upstream; reicht die URI unverändert durch (PROJEKTE.md §4.3):
    #   GET  /api/konfig                Fähigkeiten + Grenzen (Dienst aus/nicht erreichbar → {"teilen":false})
    #   POST /api/blob/fehlend          welche SHA-256 fehlen?
    #   PUT  /api/blob/<sha256>         Datei hochladen (≤ 2 MiB)   GET: Datei lesen
    #   POST /api/teilen                neuer Link (Body = Manifest ≤ 64 KiB)
    #   GET  /api/teilen/<id>[@<n>]     neueste bzw. feste Version
    #   POST/DELETE /api/teilen/<id>    neue Version / Link löschen (Authorization: Bearer <schlüssel>)
    # Keine Zugriffs- und nur kritische Fehlerprotokolle: IDs in der Anfragezeile sind Zugriffsrechte.
    location ^~ /api/ {
        access_log off;
        error_log  /dev/stderr crit;
        default_type application/json;
        client_max_body_size    64k;
        client_body_buffer_size 64k;

        # Ausfall/Überlast als JSON (nur von nginx selbst erzeugte Fehler; Antworten des Dienstes bleiben)
        error_page 502 504 = @teilen_upstream_fehler;
        error_page 429     = @teilen_zu_viele;
        error_page 413     = @teilen_zu_gross;

        location = /api/konfig {
            if ($request_method !~ ^(GET|HEAD)$) {
                return 405 '{"fehler":"Nur GET erlaubt."}\n';
            }
            if ($teilen_upstream = "") {
                return 200 '{"teilen":false}\n';
            }
            proxy_pass $teilen_upstream;
            include /etc/nginx/pizza-proxy.conf;
            proxy_intercept_errors on;
            error_page 500 502 503 504 = @teilen_aus;
        }

        location = /api/blob/fehlend {
            if ($teilen_upstream = "") {
                return 503 '{"fehler":"Teilen ist auf diesem Server nicht eingerichtet."}\n';
            }
            if ($request_method != POST) {
                return 405 '{"fehler":"Nur POST erlaubt."}\n';
            }
            limit_req zone=teilen_fehlend burst=20 nodelay;
            proxy_pass $teilen_upstream;
            include /etc/nginx/pizza-proxy.conf;
        }

        location ~ "^/api/blob/[0-9a-f]{64}$" {
            if ($teilen_upstream = "") {
                return 503 '{"fehler":"Teilen ist auf diesem Server nicht eingerichtet."}\n';
            }
            if ($request_method !~ ^(GET|HEAD|PUT)$) {
                return 405 '{"fehler":"Nur GET oder PUT erlaubt."}\n';
            }
            limit_req zone=blob_lesen burst=300 nodelay;
            limit_req zone=blob_hoch  burst=120 nodelay;
            client_max_body_size    2m;
            client_body_buffer_size 128k;
            proxy_pass $teilen_upstream;
            include /etc/nginx/pizza-proxy.conf;
            # eigene 413-Meldung; error_page hier neu, daher auch die geerbten Codes wiederholen
            error_page 502 504 = @teilen_upstream_fehler;
            error_page 429     = @teilen_zu_viele;
            error_page 413     = @blob_zu_gross;
        }

        location = /api/teilen {
            if ($teilen_upstream = "") {
                return 503 '{"fehler":"Teilen ist auf diesem Server nicht eingerichtet."}\n';
            }
            if ($request_method != POST) {
                return 405 '{"fehler":"Nur POST erlaubt."}\n';
            }
            limit_req zone=teilen_schreiben burst=3 nodelay;
            proxy_pass $teilen_upstream;
            include /etc/nginx/pizza-proxy.conf;
        }

        # Alte Hastebin-Schlüssel (10 Kleinbuchstaben) verfallen mit klarer Meldung (Nutzerentscheidung F6)
        location ~ "^/api/teilen/[a-z]{10}$" {
            return 404 '{"fehler":"Dieser Link stammt vom alten Teilen-Dienst und ist nicht mehr verfügbar.","alt":true}\n';
        }

        # Feste Version: nur lesen
        location ~ "^/api/teilen/[0-9A-Za-z]{12}@[1-9][0-9]{0,5}$" {
            if ($teilen_upstream = "") {
                return 503 '{"fehler":"Teilen ist auf diesem Server nicht eingerichtet."}\n';
            }
            if ($request_method !~ ^(GET|HEAD)$) {
                return 405 '{"fehler":"Nur GET erlaubt."}\n';
            }
            limit_req zone=teilen_lesen burst=20 nodelay;
            proxy_pass $teilen_upstream;
            include /etc/nginx/pizza-proxy.conf;
        }

        # Neueste Version lesen, neue Version posten, Link löschen – nur hier geht der Schlüssel an den Dienst
        location ~ "^/api/teilen/[0-9A-Za-z]{12}$" {
            if ($teilen_upstream = "") {
                return 503 '{"fehler":"Teilen ist auf diesem Server nicht eingerichtet."}\n';
            }
            if ($request_method !~ ^(GET|HEAD|POST|DELETE)$) {
                return 405 '{"fehler":"Diese Methode ist hier nicht erlaubt."}\n';
            }
            limit_req zone=teilen_lesen     burst=20 nodelay;
            limit_req zone=teilen_schreiben burst=3  nodelay;
            proxy_pass $teilen_upstream;
            include /etc/nginx/pizza-proxy.conf;
            proxy_set_header Authorization $http_authorization;
        }

        return 404 '{"fehler":"Unbekannter Endpunkt oder ungültiger Link."}\n';
    }

    # Benannte Locations erben nichts von /api/ → Protokolle hier ebenfalls aus
    location @teilen_aus {
        access_log off;
        error_log  /dev/stderr crit;
        default_type application/json;
        return 200 '{"teilen":false}\n';
    }

    location @teilen_upstream_fehler {
        access_log off;
        error_log  /dev/stderr crit;
        default_type application/json;
        return 502 '{"fehler":"Der Teilen-Dienst ist gerade nicht erreichbar."}\n';
    }

    location @teilen_zu_gross {
        access_log off;
        error_log  /dev/stderr crit;
        default_type application/json;
        return 413 '{"fehler":"Die Anfrage ist zu groß zum Teilen (höchstens 64 KB)."}\n';
    }

    location @blob_zu_gross {
        access_log off;
        error_log  /dev/stderr crit;
        default_type application/json;
        return 413 '{"fehler":"Die Datei ist zu groß zum Teilen (höchstens 2 MB)."}\n';
    }

    location @teilen_zu_viele {
        access_log off;
        error_log  /dev/stderr crit;
        default_type application/json;
        return 429 '{"fehler":"Zu viele Anfragen – bitte kurz warten."}\n';
    }

    # --- Native pizza-host-Binaries für den EXE-Download (UI lädt per fetch/Blob)
    #   /bin/ziele.json  Liste der Ziele (no-cache)
    #   /bin/<datei>     Binary als application/octet-stream (1 h Cache + ETag)
    location ^~ /bin/ {
        location ~ \.json$ {
            types     { application/json json; }
            try_files $uri =404;
        }
        types        { }
        default_type application/octet-stream;
        try_files    $uri =404;
    }

    # --- pizza-Quelltexte und erwartete Ausgaben als Klartext ---------------
    location ~* \.(?:pizza|erwartet)$ {
        types        { }
        default_type text/plain;
        try_files    $uri =404;
    }

    # --- Modelle (H-K16): .glb als model/gltf-binary, .gltf als model/gltf+json, Puffer .bin als Bytes; fehlend → 404
    location ~* \.(?:glb|gltf|bin)$ {
        types        { model/gltf-binary glb; model/gltf+json gltf; application/octet-stream bin; }
        default_type application/octet-stream;
        try_files    $uri =404;
    }

    # --- Statische Assets: fehlende Dateien sind echte 404 (kein SPA-Fallback)
    location ~* \.(?:js|mjs|css|json|map|svg|png|jpe?g|ico|webp|txt|woff2?|wasm)$ {
        try_files $uri =404;
    }

    # Versteckte Dateien nie ausliefern
    location ~ /\. {
        return 404;
    }

    # --- SPA-Fallback -------------------------------------------------------
    location / {
        try_files $uri $uri/ /index.html;
    }
}
