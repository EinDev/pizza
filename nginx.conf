# nginx-Konfiguration für den pizza-Playground
# Wird nach /etc/nginx/conf.d/default.conf kopiert (also innerhalb von http { }).
# Basis-Image: nginxinc/nginx-unprivileged (läuft als uid 101, lauscht auf 8080).

server_tokens off;

# --- Laufzeit-Konfiguration aus Umgebungsvariablen -------------------------
# Gerendert aus nginx-teilen.conf.template (resolver, $hastebin_upstream,
# $teilen_aktiv, $teilen_aufbewahrung_tage).
# Liegt auf /tmp, damit es auch mit read_only-Root-Dateisystem funktioniert.
include /tmp/pizza-env/*.conf;

# --- Echte Client-IP hinter Reverse-Proxy (Coolify/Traefik) ----------------
# Nur privaten Netzen wird X-Forwarded-For geglaubt.
set_real_ip_from  10.0.0.0/8;
set_real_ip_from  172.16.0.0/12;
set_real_ip_from  192.168.0.0/16;
set_real_ip_from  127.0.0.1;
real_ip_header    X-Forwarded-For;
real_ip_recursive on;

# --- Rate-Limits für /api/teilen ------------------------------------------
# Leerer Schlüssel = nicht begrenzt; POST und GET getrennt.
map $request_method $teilen_post_key {
    POST    $binary_remote_addr;
    default "";
}
map $request_method $teilen_get_key {
    GET     $binary_remote_addr;
    HEAD    $binary_remote_addr;
    default "";
}
limit_req_zone $teilen_post_key zone=teilen_post:1m rate=10r/m;
limit_req_zone $teilen_get_key  zone=teilen_get:1m  rate=60r/m;
limit_req_status 429;
limit_req_log_level warn;

# --- Cache-Header zentral -------------------------------------------------
# Wichtig: add_header steht nur auf Server-Ebene (sonst gehen in Locations
# alle geerbten Header verloren). Deshalb wird Cache-Control hier per map bestimmt.
map $uri $pizza_cache_control {
    default                                   "no-cache";
    ~^/api/                                   "no-store";
    ~^/bin/.*\.json$                          "no-cache";
    # Host-Binaries tragen einen Inhalts-Hash im Namen → dürfen ewig gecacht werden
    ~^/bin/                                   "public, max-age=31536000, immutable";
    # JS/CSS haben keine versionierten Namen: immer per ETag nachfragen, sonst laufen
    # Worker/Seite nach einem Deploy mit altem Interpreter (veraltete Methoden etc.)
    ~*\.(?:js|css|mjs|wasm)$                  "no-cache";
    ~*\.(?:svg|png|ico|webp|woff2?)$          "public, max-age=86400";
    ~*\.(?:html|json|pizza|erwartet)$         "no-cache";
}

# Fehlerseiten (404 …) nie cachen
map $status $pizza_cache_header {
    200     $pizza_cache_control;
    206     $pizza_cache_control;
    304     $pizza_cache_control;
    default "no-store";
}

# --- gzip -----------------------------------------------------------------
gzip            on;
gzip_vary       on;
gzip_comp_level 6;
gzip_min_length 512;
gzip_proxied    any;
gzip_types      text/plain text/css text/javascript application/javascript
                application/json image/svg+xml application/manifest+json
                application/wasm;   # Herd: glut_bg.wasm 1,9 MB → ~0,7 MB, kern.wasm, laufzeit.wasm

server {
    listen      8080;
    listen      [::]:8080;
    server_name _;

    root  /usr/share/nginx/html;
    index index.html;

    charset       utf-8;
    charset_types text/plain text/css text/javascript application/javascript
                  application/json image/svg+xml;

    # Redirects (z. B. /beispiele -> /beispiele/) relativ, damit Port-Mappings passen
    absolute_redirect off;

    # --- Sicherheits- und Cache-Header (gelten überall, auch für 404) -----
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; worker-src 'self'; connect-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; font-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Frame-Options "DENY" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), interest-cohort=()" always;
    # Cross-Origin-Isolation (SharedArrayBuffer/Atomics für interaktive Eingabe, EINGABE.md §3)
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Embedder-Policy "require-corp" always;
    add_header Cross-Origin-Resource-Policy "same-origin" always;
    add_header Cache-Control $pizza_cache_header always;

    # --- Healthcheck --------------------------------------------------------
    location = /healthz {
        access_log   off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # --- Teilen über den internen haste-server (nicht öffentlich erreichbar)
    #   POST /api/teilen        -> $HASTEBIN_URL/documents   (Body = Rohtext) -> {"key":"…"}
    #   GET  /api/teilen/<key>  -> $HASTEBIN_URL/raw/<key>
    #   GET  /api/konfig        -> {"teilen":true|false,"aufbewahrungTage":90|null,"aufbewahrungAb":"erstellung"}
    # Standard für HASTEBIN_URL ist der interne Compose-Service http://hastebin:8290.
    location ^~ /api/ {
        default_type application/json;

        # Upstream-Fehler/-Ausfall als JSON
        error_page 502 504 = @teilen_upstream_fehler;
        error_page 429     = @teilen_zu_viele;
        error_page 413     = @teilen_zu_gross;

        location = /api/konfig {
            if ($request_method !~ ^(GET|HEAD)$) {
                return 405 '{"fehler":"Nur GET erlaubt."}\n';
            }
            # aufbewahrungAb: haste-server speichert per Redis SETEX und liest mit
            # einfachem GET -> die Frist läuft fest ab Erstellung (Abrufe verlängern nicht).
            return 200 '{"teilen":$teilen_aktiv,"aufbewahrungTage":$teilen_aufbewahrung_tage,"aufbewahrungAb":"erstellung"}\n';
        }

        location = /api/teilen {
            if ($hastebin_upstream = "") {
                return 503 '{"fehler":"Teilen ist auf diesem Server nicht eingerichtet."}\n';
            }
            if ($request_method != POST) {
                return 405 '{"fehler":"Nur POST erlaubt."}\n';
            }
            limit_req zone=teilen_post burst=3 nodelay;
            client_max_body_size 256k;
            client_body_buffer_size 256k;

            proxy_pass $hastebin_upstream/documents;
            include /etc/nginx/pizza-proxy.conf;
            proxy_set_header Content-Type "text/plain; charset=utf-8";
        }

        location ~ "^/api/teilen/([A-Za-z0-9]{1,64})$" {
            set $teilen_key $1;
            if ($hastebin_upstream = "") {
                return 503 '{"fehler":"Teilen ist auf diesem Server nicht eingerichtet."}\n';
            }
            if ($request_method !~ ^(GET|HEAD)$) {
                return 405 '{"fehler":"Nur GET erlaubt."}\n';
            }
            limit_req zone=teilen_get burst=10 nodelay;

            proxy_pass $hastebin_upstream/raw/$teilen_key;
            # Unbekannte/abgelaufene Schlüssel: haste-server antwortet 404 (bzw. 500
            # wegen eines Upstream-Serialisierungsfehlers) -> einheitlich 404 als JSON.
            # (error_page hier neu, daher auch die geerbten Codes wiederholen.)
            proxy_intercept_errors on;
            error_page 404 500 = @teilen_nicht_gefunden;
            error_page 502 503 504 = @teilen_upstream_fehler;
            error_page 429 = @teilen_zu_viele;
            include /etc/nginx/pizza-proxy.conf;
        }

        return 404 '{"fehler":"Unbekannter Endpunkt oder ungültiger Schlüssel."}\n';
    }

    location @teilen_upstream_fehler {
        default_type application/json;
        return 502 '{"fehler":"Der Teilen-Dienst ist gerade nicht erreichbar."}\n';
    }

    location @teilen_nicht_gefunden {
        default_type application/json;
        return 404 '{"fehler":"Dieser geteilte Code existiert nicht (mehr)."}
';
    }

    location @teilen_zu_gross {
        default_type application/json;
        return 413 '{"fehler":"Der Code ist zu groß zum Teilen (max. 256 KB)."}\n';
    }

    location @teilen_zu_viele {
        default_type application/json;
        return 429 '{"fehler":"Zu viele Anfragen – bitte kurz warten."}\n';
    }

    # --- Native pizza-host-Binaries für den EXE-Download (UI lädt per fetch/Blob)
    #   /bin/ziele.json  Liste der Ziele (no-cache)
    #   /bin/<datei>     Binary als application/octet-stream (1 h Cache + ETag)
    location ^~ /bin/ {
        location ~ \.json$ {
            types     { application/json json; }
            try_files $uri =404;
        }
        types        { }
        default_type application/octet-stream;
        try_files    $uri =404;
    }

    # --- pizza-Quelltexte und erwartete Ausgaben als Klartext ---------------
    location ~* \.(?:pizza|erwartet)$ {
        types        { }
        default_type text/plain;
        try_files    $uri =404;
    }

    # --- Statische Assets: fehlende Dateien sind echte 404 (kein SPA-Fallback)
    location ~* \.(?:js|mjs|css|json|map|svg|png|ico|webp|txt|woff2?|wasm)$ {
        try_files $uri =404;
    }

    # Versteckte Dateien nie ausliefern
    location ~ /\. {
        return 404;
    }

    # --- SPA-Fallback -------------------------------------------------------
    location / {
        try_files $uri $uri/ /index.html;
    }
}
