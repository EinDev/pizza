# Gemeinsame Proxy-Einstellungen für den internen Teilen-Service (haste-server),
# eingebunden in nginx.conf. Das proxy_pass-Ziel ist eine Variable -> DNS-Auflösung
# zur Laufzeit, der Container startet also auch, wenn der Service (noch) nicht läuft.

# Nur ausgewählte Header weiterreichen: keine Cookies, kein Referer/Origin/User-Agent.
# X-Real-IP = echte Client-IP (für das Rate-Limit des haste-server).
proxy_pass_request_headers off;
proxy_set_header Host            $proxy_host;
proxy_set_header X-Real-IP       $remote_addr;
proxy_set_header Accept          "application/json, text/plain";
proxy_set_header User-Agent      "pizza-playground";
proxy_set_header Accept-Encoding "";

proxy_http_version 1.1;
proxy_set_header Connection "";

proxy_connect_timeout 5s;
proxy_send_timeout    15s;
proxy_read_timeout    15s;

proxy_redirect off;
proxy_buffering on;

# Nichts vom Upstream durchreichen, was Cookies setzt oder unsere Header doppelt
proxy_ignore_headers Set-Cookie Expires Cache-Control;
proxy_hide_header Set-Cookie;
proxy_hide_header Content-Security-Policy;
proxy_hide_header X-Frame-Options;
proxy_hide_header X-Content-Type-Options;
proxy_hide_header Referrer-Policy;
proxy_hide_header Permissions-Policy;
proxy_hide_header Strict-Transport-Security;
proxy_hide_header Cache-Control;
proxy_hide_header Access-Control-Allow-Origin;
proxy_hide_header Access-Control-Allow-Credentials;
proxy_hide_header Server;
proxy_hide_header X-Powered-By;
proxy_hide_header Via;
proxy_hide_header Report-To;
proxy_hide_header NEL;
proxy_hide_header x-ratelimit-limit;
proxy_hide_header x-ratelimit-remaining;
proxy_hide_header x-ratelimit-reset;
