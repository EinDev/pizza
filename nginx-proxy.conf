# Gemeinsame Proxy-Einstellungen für den internen Teilen-Dienst Durchreiche,
# eingebunden in nginx.conf. Das proxy_pass-Ziel ist eine Variable -> DNS-Auflösung
# zur Laufzeit, der Container startet also auch, wenn der Dienst (noch) nicht läuft.
# proxy_pass $teilen_upstream; (ohne URI) reicht die Anfrage-URI unverändert durch (/api/…).

# Nur ausgewählte Header weiterreichen: keine Cookies, kein Referer/Origin/User-Agent.
# X-Real-IP = echte Client-IP (nach real_ip), überschreibt einen vom Client gesendeten Wert –
# der Dienst führt damit seine Rate-Limits und Byte-Zähler (nur im Speicher).
# Content-Type braucht der Dienst für die 415-Prüfung (Schutz vor fremden Formularen);
# Authorization reicht nur die Location für POST/DELETE /api/teilen/<id> weiter (nginx.conf).
proxy_pass_request_headers off;
proxy_set_header Host            $proxy_host;
proxy_set_header X-Real-IP       $remote_addr;
proxy_set_header Content-Type    $content_type;
proxy_set_header Accept          "application/json, application/octet-stream";
proxy_set_header User-Agent      "pizza-playground";
proxy_set_header Accept-Encoding "";

proxy_http_version 1.1;
proxy_set_header Connection "";

proxy_connect_timeout 5s;
proxy_send_timeout    15s;
proxy_read_timeout    15s;

proxy_redirect off;
proxy_buffering on;

# Nichts vom Upstream durchreichen, was Cookies setzt oder unsere Header doppelt
# (Cache-Control setzt nginx.conf über die Map $pizza_cache_control)
proxy_ignore_headers Set-Cookie Expires Cache-Control;
proxy_hide_header Set-Cookie;
proxy_hide_header Content-Security-Policy;
proxy_hide_header X-Frame-Options;
proxy_hide_header X-Content-Type-Options;
proxy_hide_header Referrer-Policy;
proxy_hide_header Permissions-Policy;
proxy_hide_header Strict-Transport-Security;
proxy_hide_header Cache-Control;
proxy_hide_header Access-Control-Allow-Origin;
proxy_hide_header Access-Control-Allow-Credentials;
proxy_hide_header Server;
proxy_hide_header X-Powered-By;
proxy_hide_header Via;
proxy_hide_header Report-To;
proxy_hide_header NEL;
