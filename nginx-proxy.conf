# Gemeinsame Proxy-Einstellungen für hastebin.com (eingebunden in nginx.conf).
# Variable im proxy_pass-Ziel erzwingt DNS-Auflösung zur Laufzeit -> Container
# startet auch ohne Netz. ($hastebin_host ist hier fest.)

# Nur ausgewählte Header weiterreichen: keine Cookies, keine Client-IP,
# kein Referer/Origin/User-Agent des Nutzers.
proxy_pass_request_headers off;
proxy_set_header Host            hastebin.com;
proxy_set_header Authorization   "Bearer $hastebin_token";
proxy_set_header Accept          "application/json, text/plain";
proxy_set_header User-Agent      "pizza-playground";
proxy_set_header Accept-Encoding "";

proxy_http_version 1.1;
proxy_set_header Connection "";

proxy_ssl_server_name        on;
proxy_ssl_name               hastebin.com;
proxy_ssl_protocols          TLSv1.2 TLSv1.3;
proxy_ssl_verify             on;
proxy_ssl_verify_depth       3;
proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;

proxy_connect_timeout 5s;
proxy_send_timeout    15s;
proxy_read_timeout    15s;

proxy_redirect off;
proxy_buffering on;

# Nichts vom Upstream durchreichen, was Cookies setzt oder unsere Header doppelt
proxy_ignore_headers Set-Cookie Expires Cache-Control;
proxy_hide_header Set-Cookie;
proxy_hide_header Content-Security-Policy;
proxy_hide_header X-Frame-Options;
proxy_hide_header X-Content-Type-Options;
proxy_hide_header Referrer-Policy;
proxy_hide_header Permissions-Policy;
proxy_hide_header Strict-Transport-Security;
proxy_hide_header Cache-Control;
proxy_hide_header Access-Control-Allow-Origin;
proxy_hide_header Access-Control-Allow-Credentials;
proxy_hide_header Server;
proxy_hide_header X-Powered-By;
proxy_hide_header Via;
proxy_hide_header Report-To;
proxy_hide_header NEL;
