# Gemeinsame Proxy-Einstellungen für den Hastebin-Upstream (eingebunden in nginx.conf).
# Das proxy_pass-Ziel ist eine Variable -> DNS-Auflösung zur Laufzeit, der Container
# startet also auch, wenn der Hastebin-Service (noch) nicht erreichbar ist.

# Nur ausgewählte Header weiterreichen: keine Cookies, keine Client-IP,
# kein Referer/Origin/User-Agent des Nutzers. X-Real-IP nur beim internen Service.
proxy_pass_request_headers off;
proxy_set_header Host            $proxy_host;
proxy_set_header Authorization   $hastebin_auth;
proxy_set_header X-Real-IP       $hastebin_real_ip;
proxy_set_header Accept          "application/json, text/plain";
proxy_set_header User-Agent      "pizza-playground";
proxy_set_header Accept-Encoding "";

proxy_http_version 1.1;
proxy_set_header Connection "";

# (nur relevant, wenn HASTEBIN_URL https ist)
proxy_ssl_server_name        on;
proxy_ssl_protocols          TLSv1.2 TLSv1.3;
proxy_ssl_verify             on;
proxy_ssl_verify_depth       3;
proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;

proxy_connect_timeout 5s;
proxy_send_timeout    15s;
proxy_read_timeout    15s;

proxy_redirect off;
proxy_buffering on;

# Nichts vom Upstream durchreichen, was Cookies setzt oder unsere Header doppelt
proxy_ignore_headers Set-Cookie Expires Cache-Control;
proxy_hide_header Set-Cookie;
proxy_hide_header Content-Security-Policy;
proxy_hide_header X-Frame-Options;
proxy_hide_header X-Content-Type-Options;
proxy_hide_header Referrer-Policy;
proxy_hide_header Permissions-Policy;
proxy_hide_header Strict-Transport-Security;
proxy_hide_header Cache-Control;
proxy_hide_header Access-Control-Allow-Origin;
proxy_hide_header Access-Control-Allow-Credentials;
proxy_hide_header Server;
proxy_hide_header X-Powered-By;
proxy_hide_header Via;
proxy_hide_header Report-To;
proxy_hide_header NEL;
