[package]
name = "herd-werkzeug"
description = "herd-bild: Nachrichten-Dateien → PNG, Schriftatlas, GLSL-Erzeugung, Demo-Szenen"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "herd-bild"
path = "src/main.rs"

[dependencies]
herd-kern = { path = "../kern" }
herd-gpu = { path = "../gpu" }
ttf-parser = "0.25.1"
png = "0.18.1"
naga = { version = "30.0.1", default-features = false, features = ["wgsl-in", "glsl-out"] }
