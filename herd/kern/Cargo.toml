[package]
name = "herd-kern"
description = "Herd-Kern: Welt, Komponenten, Systeme → Bildpaket (no_std, bitgleich nativ = Wasm)"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
path = "src/lib.rs"

[features]
# Test-Komponente `Probe` auch außerhalb von `cargo test` (z. B. für Werkzeuge).
probe = []

[dependencies]
libm = "0.2.16"

[dev-dependencies]
# H-K16: die Kern-Tests backen die Testmodelle (herd/teigling/testmodelle) mit dem Vorbacker zu Modellteigen
herd-teigling = { path = "../teigling" }
