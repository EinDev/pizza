[package]
name = "herd-gpu"
description = "Herd-GPU-Schicht: zeichnet die Zeichenliste des Kerns mit wgpu (offscreen und Fenster)"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
herd-kern = { path = "../kern" }
pollster = "0.4"
raw-window-handle = "0.6"

[target.'cfg(windows)'.dependencies]
wgpu = { version = "30.0.1", default-features = false, features = ["std", "wgsl", "dx12"] }

[target.'cfg(target_os = "linux")'.dependencies]
wgpu = { version = "30.0.1", default-features = false, features = ["std", "wgsl", "vulkan", "gles"] }

[target.'cfg(not(any(windows, target_os = "linux")))'.dependencies]
wgpu = { version = "30.0.1", default-features = false, features = ["std", "wgsl"] }
