[package]
name = "herd-skript"
description = "Herd-Szenen-Skripte: Folgen von ABI-Aufrufen nativ abspielen (Determinismus-Test, Messung, herd-bild)"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "herd-skript"
path = "src/main.rs"

[dependencies]
herd-kern = { path = "../kern" }
# teigling_muster (PD3): Mipmaps und Teigling-Kopf genau wie der Vorbacker
herd-teigling = { path = "../teigling" }

# Testbau: Probe-Komponente (H-K0-Feldtypen) für tests/probe.herd – nur `cargo test`, nicht herd-skript/kern.wasm.
[dev-dependencies]
herd-kern = { path = "../kern", features = ["probe"] }
