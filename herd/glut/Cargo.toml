[package]
name = "herd-glut"
description = "Herd-Glut (Schicht 1): zeichnet Bildpakete des Herd-Kerns mit wgpu – offscreen (Software-Adapter) oder in ein Fenster"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
herd-kern = { path = "../kern" }
raw-window-handle = "0.6"

# Bindungswächter (H-K15, src/waechter.rs): WGSL → GLSL ES 3.00 wie wgpu für WebGL2 – dieselbe naga-Version wie wgpu
[dev-dependencies]
naga = { version = "30.0.1", features = ["wgsl-in", "glsl-out"] }

# nativ: blockierend auf wgpu warten (im Browser gibt es kein Blockieren → Glut::neu_async, H6)
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
pollster = "0.4"

[target.'cfg(windows)'.dependencies]
wgpu = { version = "30.0.1", default-features = false, features = ["std", "wgsl", "dx12"] }

[target.'cfg(target_os = "linux")'.dependencies]
wgpu = { version = "30.0.1", default-features = false, features = ["std", "wgsl", "vulkan", "gles"] }

[target.'cfg(not(any(windows, target_os = "linux", target_arch = "wasm32")))'.dependencies]
wgpu = { version = "30.0.1", default-features = false, features = ["std", "wgsl"] }

# Browser (Paket H6, herd/glut-web): WebGPU bevorzugt, Rückfall WebGL2 – wgpu wählt beim Anlegen (Glut::neu_async)
[target.'cfg(target_arch = "wasm32")'.dependencies]
wgpu = { version = "30.0.1", default-features = false, features = ["std", "wgsl", "webgpu", "webgl"] }
web-sys = { version = "0.3", features = ["OffscreenCanvas", "HtmlCanvasElement"] }
