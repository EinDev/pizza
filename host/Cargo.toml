[package]
name = "pizza-host"
version = "0.1.0"
edition = "2021"
description = "Nativer Host für kompilierte pizza-Programme (.pkarton = WebAssembly)"
license = "MIT"

[[bin]]
name = "pizza-host"
path = "src/main.rs"
test = false

[features]
# Theke (THEKE.md §4): eigenes Fenster über die System-WebView (wry + tao). Ohne Feature: W0100-Verhalten.
default = ["theke"]
theke = ["dep:wry", "dep:tao", "dep:serde_json"]
# Linux-Starter (src/starter.rs): ohne wry/tao bauen (--no-default-features --features starter) und den Theke-Teil
# (pizza-host mit Feature theke) aus PIZZA_THEKE_EXE einbetten – startet ohne WebKitGTK, meldet es bei Theke-Programmen.
starter = []

[dependencies]
wry = { version = "0.57.0", optional = true }
tao = { version = "0.37.1", optional = true }
serde_json = { version = "1", optional = true }
wasmi = { version = "2.0.0", default-features = false, features = ["std", "stable", "validate", "auto-dispatch"] }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"

[lib]
name = "pizzahost"
path = "src/lib.rs"

[dev-dependencies]
wat = "1"

# Engine-Kern trotz Größenoptimierung schnell halten.
[profile.release.package.wasmi]
opt-level = 3
[profile.release.package.wasmi_core]
opt-level = 3
[profile.release.package.wasmi_ir]
opt-level = 3
