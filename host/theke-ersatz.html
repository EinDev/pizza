<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Theke</title>
<!--
  Ersatz-Renderer für den nativen Host, falls site/js/theke/fenster.html beim Bauen fehlt.
  Gleiche Brücke wie der echte Renderer: Host → window.pizzaThekeEmpfange(nachricht),
  Renderer → window.ipc.postMessage(JSON-Text). Protokoll: THEKE.md §3 (v1).
-->
<style>
  :root { --tomate: #c0392b; --basilikum: #2e7d32; --mozzarella: #fdfaf3; --kruste: #8d5524; --text: #222; --rand: #d8cfc0; }
  @media (prefers-color-scheme: dark) { :root { --mozzarella: #1e1b18; --text: #eee; --rand: #4a4238; } }
  html, body { margin: 0; background: var(--mozzarella); color: var(--text); font: 15px/1.4 system-ui, sans-serif; }
  #wurzel { padding: 12px; }
  .stapel { display: flex; flex-direction: column; gap: 8px; }
  .reihe { display: flex; flex-direction: row; gap: 8px; align-items: center; flex-wrap: wrap; }
  button { font: inherit; padding: 6px 14px; border-radius: 6px; border: 1px solid var(--kruste); background: var(--tomate); color: #fff; cursor: pointer; }
  button:disabled { opacity: .5; cursor: default; }
  input[type=text] { font: inherit; padding: 6px 8px; border: 1px solid var(--rand); border-radius: 6px; background: transparent; color: inherit; }
  .platzhalter { border: 1px dashed var(--tomate); padding: 4px 8px; color: var(--tomate); }
  .s-klein { font-size: 12px; } .s-gross { font-size: 20px; font-weight: 600; } .s-mono { font-family: ui-monospace, monospace; }
  .f-tomate { color: var(--tomate); } .f-basilikum { color: var(--basilikum); } .f-kruste { color: var(--kruste); }
</style>
</head>
<body>
<div id="wurzel"></div>
<script>
(function () {
  'use strict';
  var knoten = {};
  function sende(e) { try { window.ipc.postMessage(JSON.stringify(e)); } catch (x) { console.warn('Theke: keine Brücke', x); } }
  function stil(el, z) {
    var s = z.stil || {};
    if (s.breite != null) el.style.width = typeof s.breite === 'number' ? s.breite + 'px' : '';
    if (s.hoehe != null) el.style.height = typeof s.hoehe === 'number' ? s.hoehe + 'px' : '';
    if (s.abstand != null && typeof s.abstand === 'number') el.style.gap = s.abstand + 'px';
    if (s.schrift) el.classList.add('s-' + s.schrift);
    if (s.farbe) el.classList.add('f-' + s.farbe);
    if (z.sichtbar === false) el.style.display = 'none';
  }
  function setze(el, z, a) {
    if ('text' in a) {
      if (el._art === 'haken') el._label.textContent = a.text; else el.textContent = a.text;
    }
    if ('aktiv' in a && el._art === 'knopf') el.disabled = !a.aktiv;
    if ('wert' in a && el._art === 'eingabe') el.value = a.wert;
    if ('an' in a && el._art === 'haken') el._box.checked = !!a.an;
    if ('sichtbar' in a) el.style.display = a.sichtbar ? '' : 'none';
    if ('kinder' in a && (el._art === 'stapel' || el._art === 'reihe')) {
      el.textContent = '';
      (a.kinder || []).forEach(function (k) { el.appendChild(baue(k)); });
    }
  }
  function baue(z) {
    var el;
    switch (z.art) {
      case 'schild': el = document.createElement('div'); el.textContent = z.text || ''; break;
      case 'knopf':
        el = document.createElement('button'); el.textContent = z.text || '';
        if (z.aktiv === false) el.disabled = true;
        el.addEventListener('click', function () { sende({ typ: 'klick', id: z.id }); });
        break;
      case 'eingabe':
        el = document.createElement('input'); el.type = 'text'; el.value = z.wert || ''; el.placeholder = z.platzhalter || '';
        el.addEventListener('input', function () { sende({ typ: 'aenderung', id: z.id, wert: el.value }); });
        el.addEventListener('keydown', function (ev) { if (ev.key === 'Enter') sende({ typ: 'enter', id: z.id, wert: el.value }); });
        break;
      case 'haken':
        el = document.createElement('label');
        var box = document.createElement('input'); box.type = 'checkbox'; box.checked = !!z.an;
        var t = document.createElement('span'); t.textContent = ' ' + (z.text || '');
        box.addEventListener('change', function () { sende({ typ: 'aenderung', id: z.id, wert: box.checked }); });
        el.appendChild(box); el.appendChild(t); el._box = box; el._label = t;
        break;
      case 'stapel': case 'reihe':
        el = document.createElement('div'); el.className = z.art;
        (z.kinder || []).forEach(function (k) { el.appendChild(baue(k)); });
        break;
      default:
        el = document.createElement('div'); el.className = 'platzhalter'; el.textContent = 'Unbekannte Zutat: ' + z.art;
    }
    el._art = z.art; stil(el, z);
    if (z.id) knoten[z.id] = el;
    return el;
  }
  window.pizzaThekeEmpfange = function (n) {
    if (typeof n === 'string') n = JSON.parse(n);
    if (!n || typeof n !== 'object') return;
    switch (n.op) {
      case 'fenster': if (n.titel) document.title = n.titel; break;
      case 'baum':
        knoten = {};
        var w = document.getElementById('wurzel'); w.textContent = '';
        if (n.wurzel) w.appendChild(baue(n.wurzel));
        break;
      case 'aendere':
        (n.aenderungen || []).forEach(function (a) { var el = knoten[a.id]; if (el) setze(el, a, a); });
        break;
      case 'schliesse': break;
      default: console.warn('Theke: unbekannte op', n.op);
    }
  };
})();
</script>
</body>
</html>
