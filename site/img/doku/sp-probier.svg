<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" font-family="system-ui, sans-serif" role="img" aria-labelledby="t">
  <title id="t">Ablauf von probier, verbrannt und rand: verbrannt ist das Fangnetz für Ananas, rand läuft immer</title>
  <defs>
    <marker id="pfeil" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#2F2A26"/>
    </marker>
  </defs>

  <!-- probier -->
  <rect x="30" y="40" width="200" height="70" rx="12" fill="#E8C48A" stroke="#C8955A" stroke-width="3"/>
  <text x="130" y="70" font-size="16" font-weight="bold" text-anchor="middle" fill="#2F2A26">probier { … }</text>
  <text x="130" y="93" font-size="14" text-anchor="middle" fill="#2F2A26">erst mal versuchen</text>

  <!-- klappt -->
  <line x1="232" y1="75" x2="406" y2="75" stroke="#2F2A26" stroke-width="3" marker-end="url(#pfeil)"/>
  <text x="320" y="65" font-size="14" font-weight="bold" text-anchor="middle" fill="#3E8E41">klappt</text>
  <rect x="410" y="40" width="200" height="70" rx="12" fill="#FFF6E0" stroke="#3E8E41" stroke-width="3"/>
  <text x="510" y="70" font-size="16" font-weight="bold" text-anchor="middle" fill="#2F2A26">alles gut</text>
  <text x="510" y="93" font-size="14" text-anchor="middle" fill="#2F2A26">weiter im Programm</text>

  <!-- Ananas fällt -->
  <line x1="130" y1="112" x2="130" y2="124" stroke="#2F2A26" stroke-width="2" stroke-dasharray="4 3"/>
  <polygon points="122,140 126,126 130,138" fill="#3E8E41"/>
  <polygon points="128,138 132,122 136,138" fill="#3E8E41"/>
  <polygon points="134,138 138,126 142,140" fill="#3E8E41"/>
  <ellipse cx="132" cy="154" rx="12" ry="16" fill="#F5C518" stroke="#C8955A" stroke-width="2"/>
  <line x1="132" y1="172" x2="132" y2="186" stroke="#2F2A26" stroke-width="2" stroke-dasharray="4 3"/>
  <text x="154" y="152" font-size="14" font-weight="bold" fill="#D9452B">Ananas fliegt!</text>
  <text x="154" y="171" font-size="14" fill="#2F2A26">(Fehler)</text>

  <!-- Fangnetz -->
  <rect x="40" y="190" width="260" height="50" rx="10" fill="#FFF6E0" stroke="#D9452B" stroke-width="3"/>
  <g stroke="#E6D3A8" stroke-width="2">
    <line x1="40" y1="207" x2="300" y2="207"/>
    <line x1="40" y1="223" x2="300" y2="223"/>
    <line x1="72" y1="190" x2="72" y2="240"/>
    <line x1="104" y1="190" x2="104" y2="240"/>
    <line x1="136" y1="190" x2="136" y2="240"/>
    <line x1="168" y1="190" x2="168" y2="240"/>
    <line x1="200" y1="190" x2="200" y2="240"/>
    <line x1="232" y1="190" x2="232" y2="240"/>
    <line x1="264" y1="190" x2="264" y2="240"/>
  </g>
  <text x="320" y="212" font-size="16" font-weight="bold" fill="#2F2A26">verbrannt (a) { … }</text>
  <text x="320" y="234" font-size="14" fill="#2F2A26">Fangnetz für die Ananas</text>

  <!-- in den Rand -->
  <g stroke="#2F2A26" stroke-width="3">
    <line x1="170" y1="242" x2="170" y2="276" marker-end="url(#pfeil)"/>
    <line x1="560" y1="112" x2="560" y2="276" marker-end="url(#pfeil)"/>
  </g>

  <!-- rand -->
  <rect x="30" y="280" width="580" height="56" rx="14" fill="#E8C48A" stroke="#C8955A" stroke-width="3"/>
  <text x="320" y="304" font-size="16" font-weight="bold" text-anchor="middle" fill="#2F2A26">rand { … }</text>
  <text x="320" y="325" font-size="14" text-anchor="middle" fill="#2F2A26">läuft immer – ob gut gegangen oder verbrannt</text>
</svg>
