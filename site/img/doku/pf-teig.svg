<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" font-family="system-ui, sans-serif" role="img" aria-labelledby="t">
  <title id="t">Teig: roh heißt nur das Rezept, gehenlassen rechnet und merkt sich das Ergebnis, backen holt den Wert ab</title>
  <defs>
    <marker id="pfeil" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#2F2A26"/>
    </marker>
  </defs>
  <g fill="#2F2A26" text-anchor="middle">
    <!-- Titel -->
    <text x="110" y="50" font-size="18" font-weight="bold">roh</text>
    <text x="320" y="50" font-size="18" font-weight="bold">aufgegangen</text>
    <text x="530" y="50" font-size="18" font-weight="bold">gebacken</text>

    <!-- Schüssel 1: kleiner Teig -->
    <ellipse cx="110" cy="166" rx="38" ry="14" fill="#E8C48A" stroke="#C8955A" stroke-width="2"/>
    <path d="M40 170 A70 50 0 0 0 180 170 Z" fill="#FFF6E0" stroke="#C8955A" stroke-width="3"/>
    <rect x="70" y="80" width="80" height="44" rx="6" fill="#FFFFFF" stroke="#2F2A26" stroke-width="2"/>
    <text x="110" y="100" font-size="14">Rezept:</text>
    <text x="110" y="117" font-size="14">6 * 7</text>

    <line x1="196" y1="180" x2="240" y2="180" stroke="#2F2A26" stroke-width="3" marker-end="url(#pfeil)"/>

    <!-- Schüssel 2: aufgegangen -->
    <ellipse cx="320" cy="150" rx="62" ry="40" fill="#E8C48A" stroke="#C8955A" stroke-width="3"/>
    <path d="M250 170 A70 50 0 0 0 390 170 Z" fill="#FFF6E0" stroke="#C8955A" stroke-width="3"/>
    <text x="320" y="140" font-size="16" font-weight="bold">42</text>

    <line x1="406" y1="180" x2="450" y2="180" stroke="#2F2A26" stroke-width="3" marker-end="url(#pfeil)"/>

    <!-- Pizza gebacken -->
    <ellipse cx="530" cy="180" rx="72" ry="26" fill="#E8C48A" stroke="#C8955A" stroke-width="3"/>
    <ellipse cx="530" cy="178" rx="56" ry="18" fill="#D9452B"/>
    <ellipse cx="510" cy="174" rx="9" ry="5" fill="#FFF6E0"/>
    <ellipse cx="552" cy="182" rx="9" ry="5" fill="#FFF6E0"/>
    <text x="530" y="130" font-size="22" font-weight="bold">42</text>

    <!-- Methoden -->
    <text x="110" y="252" font-size="15" font-weight="bold">teig(() -&gt; …)</text>
    <text x="320" y="252" font-size="15" font-weight="bold">gehenlassen()</text>
    <text x="530" y="252" font-size="15" font-weight="bold">backen()</text>

    <text x="110" y="276" font-size="14">nur das Rezept,</text>
    <text x="110" y="296" font-size="14">nichts berechnet</text>
    <text x="320" y="276" font-size="14">jetzt wird gerechnet,</text>
    <text x="320" y="296" font-size="14">Ergebnis gemerkt</text>
    <text x="530" y="276" font-size="14">Wert abholen,</text>
    <text x="530" y="296" font-size="14">höchstens 1× gerechnet</text>

    <!-- Fußzeile -->
    <text x="320" y="340" font-size="14">Ohne gehenlassen() rechnet erst backen(), mit Warnung T0007.</text>
  </g>
</svg>
