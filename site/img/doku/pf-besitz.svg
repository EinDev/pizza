<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" font-family="system-ui, sans-serif" role="img" aria-labelledby="t">
  <title id="t">Ownership: q = schieb(p) bewegt den Inhalt von Tisch 1 zu Tisch 2, Tisch 1 hat danach einen leeren Karton. Lesen von p gibt eine LeererKartonAnanas, eine Neuzuweisung füllt den Karton wieder</title>
  <defs>
    <marker id="pfeil" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#2F2A26"/>
    </marker>
  </defs>
  <g fill="#2F2A26">
    <!-- Tisch 1 -->
    <rect x="84" y="76" width="72" height="32" rx="6" fill="none" stroke="#C8955A" stroke-width="2" stroke-dasharray="5 5"/>
    <text x="120" y="97" font-size="14" font-style="italic" text-anchor="middle">leer</text>
    <rect x="40" y="110" width="160" height="12" rx="6" fill="#C8955A"/>
    <path d="M60 122 L60 146 M180 122 L180 146" stroke="#C8955A" stroke-width="5" stroke-linecap="round"/>
    <text x="120" y="168" font-size="15" font-weight="bold" text-anchor="middle">Tisch 1 (p)</text>

    <!-- Pfeil schieb -->
    <line x1="210" y1="92" x2="430" y2="92" stroke="#2F2A26" stroke-width="3" marker-end="url(#pfeil)"/>
    <text x="320" y="78" font-size="16" font-weight="bold" text-anchor="middle">q = schieb(p)</text>
    <text x="320" y="116" font-size="14" text-anchor="middle">p ist danach ein leerer Karton</text>

    <!-- Tisch 2: voller Karton -->
    <rect x="484" y="66" width="72" height="42" rx="6" fill="#E8C48A" stroke="#C8955A" stroke-width="3"/>
    <rect x="478" y="60" width="84" height="12" rx="4" fill="#C8955A"/>
    <circle cx="520" cy="88" r="9" fill="#D9452B"/>
    <circle cx="517" cy="85" r="3" fill="#FFF6E0"/>
    <rect x="440" y="110" width="160" height="12" rx="6" fill="#C8955A"/>
    <path d="M460 122 L460 146 M580 122 L580 146" stroke="#C8955A" stroke-width="5" stroke-linecap="round"/>
    <text x="520" y="168" font-size="15" font-weight="bold" text-anchor="middle">Tisch 2 (q)</text>

    <!-- Danach: lesen verboten -->
    <rect x="40" y="206" width="270" height="118" rx="14" fill="#FFF6E0" stroke="#D9452B" stroke-width="2"/>
    <text x="175" y="236" font-size="15" font-weight="bold" text-anchor="middle">Bote.sage((p));</text>
    <line x1="150" y1="252" x2="200" y2="252" stroke="#D9452B" stroke-width="3"/>
    <line x1="175" y1="244" x2="175" y2="260" stroke="#D9452B" stroke-width="3" transform="rotate(45 175 252)"/>
    <line x1="175" y1="244" x2="175" y2="260" stroke="#D9452B" stroke-width="3" transform="rotate(-45 175 252)"/>
    <text x="175" y="285" font-size="14" fill="#D9452B" font-weight="bold" text-anchor="middle">LeererKartonAnanas</text>
    <text x="175" y="308" font-size="14" text-anchor="middle">„'p' wurde weggeschoben“</text>

    <!-- Danach: neu füllen erlaubt -->
    <rect x="330" y="206" width="270" height="118" rx="14" fill="#FFF6E0" stroke="#3E8E41" stroke-width="2"/>
    <text x="465" y="236" font-size="15" font-weight="bold" text-anchor="middle">p = ["Diavolo"];</text>
    <polyline points="445,256 460,270 490,242" fill="none" stroke="#3E8E41" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="465" y="296" font-size="14" fill="#3E8E41" font-weight="bold" text-anchor="middle">erlaubt</text>
    <text x="465" y="316" font-size="14" text-anchor="middle">neuer Karton, neues Glück</text>
  </g>
</svg>
