<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="640" height="360" font-family="system-ui, sans-serif">
  <title>Freitag, 13. Oktober 2006, 19:42 Uhr: Der Bon-Drucker spuckt einen endlosen Bon mit 412 Pizzen aus, ein einzelner Koch arbeitet sie nacheinander ab.</title>

  <!-- Kalenderblatt -->
  <rect x="24" y="24" width="120" height="112" rx="10" fill="#FFF6E0" stroke="#2F2A26" stroke-width="3"/>
  <path d="M24 34 a10 10 0 0 1 10 -10 h100 a10 10 0 0 1 10 10 v24 h-120 z" fill="#D9452B" stroke="#2F2A26" stroke-width="3"/>
  <text x="84" y="47" text-anchor="middle" font-size="15" font-weight="700" fill="#FFF6E0">Okt. 2006</text>
  <text x="84" y="100" text-anchor="middle" font-size="40" font-weight="800" fill="#2F2A26">13</text>
  <text x="84" y="126" text-anchor="middle" font-size="15" fill="#2F2A26">Freitag</text>

  <!-- Uhr 19:42 -->
  <circle cx="84" cy="212" r="46" fill="#FFF6E0" stroke="#2F2A26" stroke-width="3"/>
  <g stroke="#2F2A26" stroke-width="3" stroke-linecap="round">
    <line x1="84" y1="170" x2="84" y2="178"/>
    <line x1="126" y1="212" x2="118" y2="212"/>
    <line x1="84" y1="254" x2="84" y2="246"/>
    <line x1="42" y1="212" x2="50" y2="212"/>
    <line x1="84" y1="212" x2="64" y2="228" stroke-width="4"/>
    <line x1="84" y1="212" x2="50" y2="223"/>
  </g>
  <circle cx="84" cy="212" r="4" fill="#D9452B"/>
  <text x="84" y="290" text-anchor="middle" font-size="18" font-weight="700" fill="#2F2A26">19:42 Uhr</text>

  <!-- Bon-Drucker -->
  <rect x="200" y="30" width="180" height="62" rx="12" fill="#2F2A26"/>
  <text x="282" y="62" text-anchor="middle" font-size="14" font-weight="700" fill="#FFF6E0" letter-spacing="1">BON-DRUCKER</text>
  <circle cx="360" cy="56" r="6" fill="#D9452B"/>
  <rect x="216" y="80" width="148" height="8" rx="3" fill="#C8955A"/>

  <!-- Endloser Bon -->
  <rect x="222" y="84" width="136" height="218" fill="#FFFFFF" stroke="#E6D3A8" stroke-width="2"/>
  <g font-size="14" fill="#2F2A26">
    <text x="232" y="112">#1 Margherita</text>
    <text x="232" y="136">#2 Salami</text>
    <text x="232" y="160">#3 Funghi</text>
    <text x="232" y="184">#4 Margherita</text>
    <text x="232" y="208">#5 Tonno</text>
    <text x="232" y="232">…</text>
    <text x="232" y="256">#411 Funghi</text>
    <text x="232" y="280">#412 Salami</text>
  </g>
  <!-- Gefalteter Bon-Haufen am Boden -->
  <g fill="#FFFFFF" stroke="#E6D3A8" stroke-width="2" stroke-linejoin="round">
    <polygon points="222,302 358,302 384,314 196,314"/>
    <polygon points="196,314 384,314 366,326 214,326"/>
    <polygon points="214,326 366,326 392,338 188,338"/>
  </g>

  <!-- Aufkleber 412 -->
  <circle cx="410" cy="150" r="38" fill="#F2B33D" stroke="#2F2A26" stroke-width="3"/>
  <text x="410" y="152" text-anchor="middle" font-size="24" font-weight="800" fill="#2F2A26">412</text>
  <text x="410" y="171" text-anchor="middle" font-size="14" font-weight="700" fill="#2F2A26">Pizzen</text>

  <!-- Sprechblase -->
  <rect x="436" y="18" width="196" height="50" rx="16" fill="#FFF6E0" stroke="#2F2A26" stroke-width="2.5"/>
  <polygon points="486,66 502,66 482,90" fill="#FFF6E0" stroke="#2F2A26" stroke-width="2.5" stroke-linejoin="round"/>
  <line x1="487" y1="66" x2="501" y2="66" stroke="#FFF6E0" stroke-width="4"/>
  <text x="534" y="48" text-anchor="middle" font-size="14" fill="#2F2A26">Eine nach der anderen …</text>

  <!-- Der eine Koch -->
  <g stroke="#2F2A26" stroke-width="2.5">
    <rect x="512" y="98" width="36" height="22" rx="4" fill="#FFFFFF"/>
    <circle cx="518" cy="96" r="10" fill="#FFFFFF"/>
    <circle cx="530" cy="90" r="12" fill="#FFFFFF"/>
    <circle cx="542" cy="96" r="10" fill="#FFFFFF"/>
    <rect x="514" y="96" width="32" height="12" fill="#FFFFFF" stroke="none"/>
    <circle cx="530" cy="142" r="24" fill="#F2D0A9"/>
    <path d="M494 260 L500 182 Q530 166 560 182 L566 260 Z" fill="#FFF6E0" stroke-linejoin="round"/>
  </g>
  <circle cx="521" cy="140" r="3" fill="#2F2A26"/>
  <circle cx="539" cy="140" r="3" fill="#2F2A26"/>
  <path d="M520 156 Q530 150 540 156" fill="none" stroke="#2F2A26" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M566 122 q5 9 0 13 q-5 -4 0 -13 z" fill="#7FB8E0"/>
  <path d="M574 140 q4 7 0 10 q-4 -3 0 -10 z" fill="#7FB8E0"/>
  <!-- Eine einzige Pizza in Arbeit -->
  <circle cx="530" cy="214" r="22" fill="#E8C48A" stroke="#C8955A" stroke-width="3"/>
  <circle cx="530" cy="214" r="15" fill="#D9452B"/>
  <circle cx="525" cy="210" r="4" fill="#FFF6E0"/>
  <circle cx="536" cy="219" r="4" fill="#FFF6E0"/>
  <text x="530" y="286" text-anchor="middle" font-size="15" font-weight="700" fill="#2F2A26">1 Koch = 1 Thread</text>

  <line x1="20" y1="342" x2="620" y2="342" stroke="#C8955A" stroke-width="3" stroke-linecap="round"/>
</svg>
