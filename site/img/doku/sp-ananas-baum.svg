<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" font-family="system-ui, sans-serif" role="img" aria-labelledby="t">
  <title id="t">Stammbaum der Ananas: Ananas teilt sich in GeprüfteAnanas und LaufzeitAnanas mit ihren Kindern</title>

  <!-- Wurzel -->
  <polygon points="306,24 312,6 318,24" fill="#3E8E41"/>
  <polygon points="314,24 320,2 326,24" fill="#3E8E41"/>
  <polygon points="322,24 328,6 334,24" fill="#3E8E41"/>
  <rect x="250" y="22" width="140" height="36" rx="12" fill="#F5C518" stroke="#C8955A" stroke-width="3"/>
  <text x="320" y="46" font-size="16" font-weight="bold" text-anchor="middle" fill="#2F2A26">Ananas</text>

  <!-- Linien -->
  <g stroke="#2F2A26" stroke-width="2" fill="none">
    <polyline points="320,58 320,72"/>
    <polyline points="130,87 130,72 436,72 436,87"/>
    <polyline points="130,123 130,143"/>
    <polyline points="436,123 436,133"/>
    <polyline points="350,143 350,133 537,133 537,143"/>
  </g>

  <!-- Familien -->
  <rect x="40" y="87" width="180" height="36" rx="10" fill="#E8C48A" stroke="#C8955A" stroke-width="2"/>
  <text x="130" y="110" font-size="15" font-weight="bold" text-anchor="middle" fill="#2F2A26">GeprüfteAnanas</text>
  <rect x="346" y="87" width="180" height="36" rx="10" fill="#E8C48A" stroke="#C8955A" stroke-width="2"/>
  <text x="436" y="110" font-size="15" font-weight="bold" text-anchor="middle" fill="#2F2A26">LaufzeitAnanas</text>

  <!-- Kinder: Geprüfte -->
  <g font-size="14" text-anchor="middle" fill="#2F2A26">
    <rect x="45" y="143" width="170" height="24" rx="8" fill="#FFF6E0" stroke="#E6D3A8" stroke-width="2"/>
    <text x="130" y="160">VerbranntAnanas</text>
    <rect x="45" y="173" width="170" height="24" rx="8" fill="#FFF6E0" stroke="#E6D3A8" stroke-width="2"/>
    <text x="130" y="190">LieferAnanas</text>
  </g>

  <!-- Kinder: Laufzeit (2 Spalten × 6) -->
  <g font-size="14" text-anchor="middle" fill="#2F2A26">
    <g fill="#FFF6E0" stroke="#E6D3A8" stroke-width="2">
      <rect x="264" y="143" width="172" height="24" rx="8"/>
      <rect x="264" y="173" width="172" height="24" rx="8"/>
      <rect x="264" y="203" width="172" height="24" rx="8"/>
      <rect x="264" y="233" width="172" height="24" rx="8"/>
      <rect x="264" y="263" width="172" height="24" rx="8"/>
      <rect x="264" y="293" width="172" height="24" rx="8"/>
      <rect x="444" y="143" width="186" height="24" rx="8"/>
      <rect x="444" y="173" width="186" height="24" rx="8"/>
      <rect x="444" y="203" width="186" height="24" rx="8"/>
      <rect x="444" y="233" width="186" height="24" rx="8"/>
      <rect x="444" y="263" width="186" height="24" rx="8"/>
      <rect x="444" y="293" width="186" height="24" rx="8"/>
    </g>
    <text x="350" y="160">StreitAnanas</text>
    <text x="350" y="190">RechenAnanas</text>
    <text x="350" y="220">LeererKartonAnanas</text>
    <text x="350" y="250">RohlingAnanas</text>
    <text x="350" y="280">BesitzAnanas</text>
    <text x="350" y="310">GebackenAnanas</text>
    <text x="537" y="160">TypAnanas</text>
    <text x="537" y="190">KeinStückAnanas</text>
    <text x="537" y="220">ZugriffsAnanas</text>
    <text x="537" y="250">UnbekannterBelagAnanas</text>
    <text x="537" y="280">ZugeklapptAnanas</text>
    <text x="537" y="310">UnbekanntePizzaAnanas</text>
  </g>

  <!-- Erklärung -->
  <g font-size="14" fill="#2F2A26">
    <text x="30" y="245">Fängst du eine Familie,</text>
    <text x="30" y="266">fängst du alle Kinder mit:</text>
    <text x="30" y="300" font-weight="bold">verbrannt (LaufzeitAnanas a)</text>
  </g>
</svg>
