      <text x="10" y="150" font-weight="bold">4 Küchen</text>
      <text x="10" y="168">brigade(…)</text>
      <text x="10" y="186">eigene Uhr</text>
      <text x="10" y="204" fill="#D9452B">| = langsamster</text>
      <text x="10" y="266" font-weight="bold">Kartons</text>
      <text x="10" y="284">nur Werte</text>
      <text x="10" y="324" font-weight="bold">Ergebnis</text>
    </g>
