<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" font-family="system-ui, sans-serif" role="img" aria-labelledby="t">
  <title id="t">Küchenbrigade: Die Hauptküche ist abgeschlossen – Köche dürfen nur hineinschauen. Vier Küchen backen gleichzeitig, jede mit eigener Uhr; es zählt der langsamste Koch. Die Kartons kommen in der Reihenfolge 1 bis 4 zurück. Wer in die Hauptküche schreibt, bekommt eine KüchenAnanas.</title>
