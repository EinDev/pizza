<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" font-family="system-ui, sans-serif" role="img" aria-labelledby="t">
  <title id="t">Kühlschrank und Mikrowelle: Ergebnisse bleiben 3 Tage frisch. Danach liefert die Mikrowelle sofort den alten Wert, meldet matschig und kocht neu</title>
  <defs>
    <marker id="pfeil" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#2F2A26"/>
    </marker>
  </defs>
  <g fill="#2F2A26">
    <!-- Kühlschrank -->
    <text x="105" y="28" font-size="14" font-weight="bold" text-anchor="middle">@Kühlschrank(haltbar: 3d)</text>
    <rect x="40" y="40" width="130" height="210" rx="12" fill="#FFFFFF" stroke="#2F2A26" stroke-width="3"/>
    <line x1="40" y1="108" x2="170" y2="108" stroke="#2F2A26" stroke-width="3"/>
    <path d="M154 62 L154 92 M154 124 L154 170" stroke="#2F2A26" stroke-width="4" stroke-linecap="round"/>
    <text x="95" y="80" font-size="14" text-anchor="middle">Cache</text>
    <rect x="50" y="160" width="100" height="40" rx="6" fill="#E8C48A" stroke="#C8955A" stroke-width="2"/>
    <text x="100" y="185" font-size="14" font-weight="bold" text-anchor="middle">Karte Nr. 1</text>

    <!-- Pfeil zur Mikrowelle -->
    <line x1="176" y1="170" x2="234" y2="170" stroke="#2F2A26" stroke-width="3" marker-end="url(#pfeil)"/>

    <!-- Mikrowelle -->
    <text x="310" y="104" font-size="14" font-weight="bold" text-anchor="middle">.mikrowelle(…)</text>
    <rect x="240" y="120" width="140" height="90" rx="10" fill="#2F2A26"/>
    <rect x="252" y="132" width="86" height="66" rx="6" fill="#F2B33D"/>
    <circle cx="360" cy="146" r="6" fill="#FFF6E0"/>
    <circle cx="360" cy="168" r="6" fill="#FFF6E0"/>
    <rect x="352" y="182" width="16" height="10" rx="3" fill="#FFF6E0"/>

    <!-- Verzweigung -->
    <path d="M384 150 L404 110 L412 110" fill="none" stroke="#2F2A26" stroke-width="3" marker-end="url(#pfeil)"/>
    <path d="M384 180 L404 210 L412 210" fill="none" stroke="#2F2A26" stroke-width="3" marker-end="url(#pfeil)"/>

    <!-- frisch -->
    <rect x="416" y="60" width="214" height="96" rx="12" fill="#FFF6E0" stroke="#3E8E41" stroke-width="3"/>
    <text x="430" y="86" font-size="15" font-weight="bold" fill="#3E8E41">frisch (unter 3 Tage)</text>
    <text x="430" y="110" font-size="14">Wert aus dem Kühlschrank</text>
    <text x="430" y="134" font-size="14">istMatschig(): nein</text>

    <!-- abgelaufen -->
    <rect x="416" y="166" width="214" height="104" rx="12" fill="#FFF6E0" stroke="#D9452B" stroke-width="3"/>
    <text x="430" y="192" font-size="15" font-weight="bold" fill="#D9452B">abgelaufen</text>
    <text x="430" y="214" font-size="14">alter Wert, sofort</text>
    <text x="430" y="236" font-size="14">istMatschig(): ja</text>
    <text x="430" y="258" font-size="14">danach wird neu gekocht</text>

    <!-- Zeitleiste -->
    <line x1="40" y1="310" x2="400" y2="310" stroke="#3E8E41" stroke-width="8" stroke-linecap="round"/>
    <line x1="400" y1="310" x2="610" y2="310" stroke="#D9452B" stroke-width="8" stroke-linecap="round"/>
    <g font-size="14" text-anchor="middle">
      <text x="40" y="296">0</text>
      <text x="160" y="296">1d</text>
      <text x="280" y="296">2d</text>
      <text x="400" y="296">3d</text>
      <text x="220" y="336" fill="#3E8E41" font-weight="bold">frisch</text>
      <text x="505" y="336" fill="#D9452B" font-weight="bold">matschig</text>
      <text x="320" y="356">simulierte Uhr, z. B. Uhr.vorspulen(4d)</text>
    </g>
  </g>
</svg>
