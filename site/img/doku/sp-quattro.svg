<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 240" font-family="system-ui, sans-serif" role="img" aria-labelledby="t">
  <title id="t">quattrostagioni: eine Pizza mit genau vier Vierteln – vier feste Werte mit Position 1 bis 4</title>

  <!-- Pizza in vier Vierteln -->
  <circle cx="170" cy="120" r="100" fill="#E8C48A" stroke="#C8955A" stroke-width="3"/>
  <circle cx="170" cy="120" r="88" fill="#D9452B"/>
  <g stroke="#E8C48A" stroke-width="4">
    <line x1="170" y1="20" x2="170" y2="220"/>
    <line x1="70" y1="120" x2="270" y2="120"/>
  </g>
  <g font-size="14" font-weight="bold" text-anchor="middle" fill="#FFF6E0">
    <text x="126" y="90">FRÜHLING</text>
    <text x="126" y="108">1</text>
    <text x="214" y="90">SOMMER</text>
    <text x="214" y="108">2</text>
    <text x="214" y="150">HERBST</text>
    <text x="214" y="168">3</text>
    <text x="126" y="150">WINTER</text>
    <text x="126" y="168">4</text>
  </g>

  <!-- Erklärung -->
  <g fill="#2F2A26">
    <text x="330" y="70" font-size="18" font-weight="bold">quattrostagioni</text>
    <text x="330" y="98" font-size="15">= genau 4 feste Werte</text>
    <text x="330" y="135" font-size="15">Jahreszeit.SOMMER → Position 2</text>
    <text x="330" y="180" font-size="15" font-weight="bold" fill="#D9452B">3 oder 5 Werte → Fehler Q0004</text>
  </g>
</svg>
