<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="640" height="360" font-family="system-ui, sans-serif" role="img">
  <title>Pizzatheke als Fenster: Ein Stapel aus Schild, Eingabe, Haken und Knopf. Ein Klick auf den Knopf geht an bediene(), das deinen Rückruf aufruft; der Rückruf ändert das Schild.</title>

  <!-- Fenster = Theke -->
  <rect x="24" y="24" width="300" height="300" rx="12" fill="#FFF6E0" stroke="#2F2A26" stroke-width="3"/>
  <path d="M36,24 L312,24 Q324,24 324,36 L324,58 L24,58 L24,36 Q24,24 36,24 z" fill="#D9452B" stroke="#2F2A26" stroke-width="3"/>
  <text x="44" y="47" font-size="15" font-weight="700" fill="#FFF6E0">Theke „Pizzarechner“</text>
  <circle cx="304" cy="41" r="7" fill="#FFF6E0" stroke="#2F2A26" stroke-width="2"/>
  <!-- Markise -->
  <path d="M24,58 L324,58 L324,72 Q309,84 294,72 Q279,84 264,72 Q249,84 234,72 Q219,84 204,72 Q189,84 174,72 Q159,84 144,72 Q129,84 114,72 Q99,84 84,72 Q69,84 54,72 Q39,84 24,72 z" fill="#3E8E41" stroke="#2F2A26" stroke-width="2" stroke-linejoin="round"/>

  <!-- Stapel-Rahmen -->
  <rect x="44" y="92" width="260" height="214" rx="8" fill="none" stroke="#C8955A" stroke-width="2" stroke-dasharray="8 6"/>

  <!-- Schild -->
  <rect x="60" y="106" width="180" height="36" rx="6" fill="#E8C48A" stroke="#C8955A" stroke-width="2"/>
  <text x="74" y="130" font-size="16" font-weight="700" fill="#2F2A26">Macht 16,00 €</text>
  <!-- Eingabe -->
  <rect x="60" y="154" width="180" height="36" rx="6" fill="#FFFFFF" stroke="#2F2A26" stroke-width="2"/>
  <text x="74" y="178" font-size="16" fill="#2F2A26">2</text>
  <path d="M86,163 L86,181" stroke="#2F2A26" stroke-width="2"/>
  <!-- Haken -->
  <rect x="60" y="204" width="24" height="24" rx="4" fill="#FFFFFF" stroke="#2F2A26" stroke-width="2"/>
  <path d="M65,216 L71,223 L80,209" fill="none" stroke="#3E8E41" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="94" y="222" font-size="15" fill="#2F2A26">extra Käse</text>
  <!-- Knopf -->
  <rect x="60" y="244" width="140" height="44" rx="22" fill="#D9452B" stroke="#2F2A26" stroke-width="3"/>
  <text x="130" y="272" text-anchor="middle" font-size="16" font-weight="700" fill="#FFF6E0">Backen!</text>

  <!-- Beschriftungen der Zutaten -->
  <g font-size="14" fill="#2F2A26">
    <text x="300" y="129" text-anchor="end" font-weight="700">Schild</text>
    <text x="300" y="177" text-anchor="end" font-weight="700">Eingabe</text>
    <text x="300" y="222" text-anchor="end" font-weight="700">Haken</text>
    <text x="300" y="272" text-anchor="end" font-weight="700">Knopf</text>
    <text x="52" y="320" font-weight="700" fill="#C8955A">Stapel</text>
  </g>

  <!-- Klick-Pfeil zum Programm -->
  <path d="M206,266 C300,266 330,250 372,250" fill="none" stroke="#2F2A26" stroke-width="3" stroke-linecap="round"/>
  <path d="M366,242 L378,250 L366,258" fill="none" stroke="#2F2A26" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="330" y="288" text-anchor="middle" font-size="14" fill="#2F2A26">Klick</text>

  <!-- Programm mit bediene() -->
  <rect x="384" y="190" width="232" height="120" rx="12" fill="#2F2A26"/>
  <text x="500" y="220" text-anchor="middle" font-size="15" font-weight="700" fill="#F2B33D">theke.bediene()</text>
  <text x="500" y="246" text-anchor="middle" font-size="14" fill="#FFF6E0">wartet auf Klicks und</text>
  <text x="500" y="266" text-anchor="middle" font-size="14" fill="#FFF6E0">ruft deinen Rückruf:</text>
  <text x="500" y="292" text-anchor="middle" font-size="14" font-weight="700" fill="#FFF6E0">() -> { … }</text>

  <!-- Rückweg: Änderung -->
  <path d="M500,188 C500,124 420,124 334,124" fill="none" stroke="#3E8E41" stroke-width="3" stroke-dasharray="10 8" stroke-linecap="round"/>
  <path d="M342,116 L330,124 L342,132" fill="none" stroke="#3E8E41" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="470" y="108" text-anchor="middle" font-size="14" fill="#2F2A26">setzeText(…) ändert</text>
  <text x="470" y="90" text-anchor="middle" font-size="14" fill="#2F2A26">das Schild</text>
</svg>
