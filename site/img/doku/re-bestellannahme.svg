<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="640" height="360" font-family="system-ui, sans-serif" role="img">
  <title>Bestelltresen: Der Gast tippt eine Zeile, die Bestellannahme reicht sie als Bon an dein Programm weiter, der Bote bringt die Antwort zurück. Geht der Gast, kommt ein leerer Karton an.</title>

  <!-- Gast -->
  <circle cx="70" cy="92" r="24" fill="#E8C48A" stroke="#2F2A26" stroke-width="3"/>
  <path d="M30,178 C30,138 110,138 110,178 z" fill="#3E8E41" stroke="#2F2A26" stroke-width="3" stroke-linejoin="round"/>
  <text x="70" y="202" text-anchor="middle" font-size="15" font-weight="700" fill="#2F2A26">Gast</text>
  <!-- Sprechblase mit Eingabe -->
  <rect x="104" y="34" width="118" height="44" rx="10" fill="#FFF6E0" stroke="#E6D3A8" stroke-width="2"/>
  <path d="M112,78 L104,94 L126,78 z" fill="#FFF6E0" stroke="#E6D3A8" stroke-width="2" stroke-linejoin="round"/>
  <text x="163" y="62" text-anchor="middle" font-size="16" font-weight="700" fill="#2F2A26">„3“ ⏎</text>

  <!-- Pfeil Gast → Tresen -->
  <path d="M120,150 L196,150" fill="none" stroke="#2F2A26" stroke-width="3" stroke-linecap="round"/>
  <path d="M190,142 L202,150 L190,158" fill="none" stroke="#2F2A26" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="160" y="140" text-anchor="middle" font-size="14" fill="#2F2A26">tippt</text>

  <!-- Tresen: Bestellannahme -->
  <rect x="208" y="96" width="196" height="118" rx="10" fill="#FFF6E0" stroke="#2F2A26" stroke-width="3"/>
  <rect x="208" y="96" width="196" height="30" rx="10" fill="#F2B33D" stroke="#2F2A26" stroke-width="3"/>
  <text x="306" y="117" text-anchor="middle" font-size="15" font-weight="700" fill="#2F2A26">Bestellannahme</text>
  <!-- Bons -->
  <rect x="222" y="138" width="80" height="30" rx="4" fill="#FFFFFF" stroke="#C8955A" stroke-width="2"/>
  <text x="262" y="158" text-anchor="middle" font-size="14" fill="#2F2A26">lies()</text>
  <rect x="310" y="138" width="82" height="30" rx="4" fill="#FFFFFF" stroke="#C8955A" stroke-width="2"/>
  <text x="351" y="158" text-anchor="middle" font-size="14" fill="#2F2A26">liesZahl()</text>
  <text x="306" y="198" text-anchor="middle" font-size="14" fill="#2F2A26">eine Zeile pro Bon</text>

  <!-- Pfeil Tresen → Programm -->
  <path d="M406,150 L470,150" fill="none" stroke="#2F2A26" stroke-width="3" stroke-linecap="round"/>
  <path d="M464,142 L476,150 L464,158" fill="none" stroke="#2F2A26" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="440" y="140" text-anchor="middle" font-size="14" font-weight="700" fill="#D9452B">3</text>

  <!-- Programm (Küche/Ofen) -->
  <rect x="482" y="88" width="138" height="126" rx="12" fill="#2F2A26" stroke="#2F2A26" stroke-width="3"/>
  <path d="M506,170 C506,132 596,132 596,170 z" fill="#D9452B" stroke="#F2B33D" stroke-width="3" stroke-linejoin="round"/>
  <text x="551" y="116" text-anchor="middle" font-size="15" font-weight="700" fill="#FFF6E0">dein</text>
  <text x="551" y="198" text-anchor="middle" font-size="15" font-weight="700" fill="#FFF6E0">Programm</text>

  <!-- Rückweg: Bote -->
  <path d="M551,216 C551,262 520,272 470,272 L150,272 C100,272 70,250 70,214" fill="none" stroke="#E6D3A8" stroke-width="20" stroke-linecap="round"/>
  <path d="M551,216 C551,262 520,272 470,272 L150,272 C100,272 70,250 70,214" fill="none" stroke="#3E8E41" stroke-width="3" stroke-dasharray="10 8"/>
  <path d="M62,224 L70,210 L78,224" fill="none" stroke="#3E8E41" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="268" y="258" width="104" height="28" rx="6" fill="#E8C48A" stroke="#C8955A" stroke-width="2"/>
  <text x="320" y="277" text-anchor="middle" font-size="14" font-weight="700" fill="#2F2A26">Bote</text>
  <text x="320" y="246" text-anchor="middle" font-size="14" fill="#2F2A26">Bote.schreibe(…) fragt · Bote.sage(…) antwortet</text>

  <!-- EOF -->
  <rect x="440" y="300" width="58" height="40" rx="4" fill="#E8C48A" stroke="#C8955A" stroke-width="2"/>
  <path d="M440,314 L498,314" stroke="#C8955A" stroke-width="2"/>
  <text x="510" y="318" font-size="14" fill="#2F2A26">Gast weg (Strg+D)</text>
  <text x="510" y="336" font-size="14" font-weight="700" fill="#2F2A26">→ karton</text>
</svg>
