<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="640" height="360" font-family="system-ui, sans-serif">
  <title>Zeitstrahl der Sprache: pizza 1.0 (2008) mit Pizzadichte-Regel, pizza 2.0 Enterprise (2013) mit ofen.xml und Komitee, pizza 3.0 (2026), in der pizza frei ist.</title>
  <line x1="30" y1="96" x2="604" y2="96" stroke="#2F2A26" stroke-width="3" stroke-linecap="round"/>
  <polygon points="602,88 618,96 602,104" fill="#2F2A26"/>
  <g>
    <text x="110" y="72" text-anchor="middle" font-size="18" font-weight="800" fill="#2F2A26">2008</text>
    <circle cx="110" cy="96" r="12" fill="#E8C48A" stroke="#2F2A26" stroke-width="3"/>
    <text x="110" y="132" text-anchor="middle" font-size="16" font-weight="700" fill="#2F2A26">pizza 1.0</text>
    <rect x="10" y="146" width="200" height="116" rx="10" fill="#FFF6E0" stroke="#E6D3A8" stroke-width="3"/>
    <text x="24" y="178" font-size="14" font-family="ui-monospace, Consolas, monospace" fill="#2F2A26" xml:space="preserve">pizzateig</text>
    <text x="24" y="206" font-size="14" font-family="ui-monospace, Consolas, monospace" fill="#2F2A26" xml:space="preserve"> pizzasage &quot;Hallo&quot;</text>
    <text x="24" y="234" font-size="14" font-family="ui-monospace, Consolas, monospace" fill="#2F2A26" xml:space="preserve">pizzarand</text>
    <text x="110" y="292" text-anchor="middle" font-size="14" fill="#2F2A26">Jedes 8. Token: „pizza“</text>
    <text x="110" y="316" text-anchor="middle" font-size="14" fill="#2F2A26">Pizzadichte-Regel</text>
  </g>
  <g>
    <text x="320" y="72" text-anchor="middle" font-size="18" font-weight="800" fill="#2F2A26">2013</text>
    <circle cx="320" cy="96" r="12" fill="#2F2A26" stroke="#2F2A26" stroke-width="3"/>
    <text x="320" y="132" text-anchor="middle" font-size="16" font-weight="700" fill="#2F2A26">pizza 2.0 Enterprise</text>
    <rect x="220" y="146" width="200" height="116" rx="10" fill="#FFF6E0" stroke="#D9452B" stroke-width="3"/>
    <text x="234" y="178" font-size="14" font-family="ui-monospace, Consolas, monospace" fill="#2F2A26" xml:space="preserve">&lt;ofen.xml&gt;</text>
    <text x="234" y="206" font-size="14" font-family="ui-monospace, Consolas, monospace" fill="#2F2A26" xml:space="preserve">@Komitee(pizza)</text>
    <text x="234" y="234" font-size="14" font-family="ui-monospace, Consolas, monospace" fill="#2F2A26" xml:space="preserve">pizzaPizzaBestell…</text>
    <text x="320" y="292" text-anchor="middle" font-size="14" fill="#2F2A26">600 Seiten Spezifikation</text>
    <text x="320" y="316" text-anchor="middle" font-size="14" fill="#2F2A26">Compiler: 47 Minuten</text>
  </g>
  <g>
    <text x="530" y="72" text-anchor="middle" font-size="18" font-weight="800" fill="#2F2A26">2026</text>
    <circle cx="530" cy="96" r="12" fill="#3E8E41" stroke="#2F2A26" stroke-width="3"/>
    <text x="530" y="132" text-anchor="middle" font-size="16" font-weight="700" fill="#2F2A26">pizza 3.0</text>
    <rect x="430" y="146" width="200" height="116" rx="10" fill="#FFF6E0" stroke="#3E8E41" stroke-width="3"/>
    <text x="444" y="178" font-size="14" font-family="ui-monospace, Consolas, monospace" fill="#2F2A26" xml:space="preserve">salami PiZZa = 1;</text>
    <text x="444" y="206" font-size="14" font-family="ui-monospace, Consolas, monospace" fill="#2F2A26" xml:space="preserve">serviere ((PiZZa));</text>
    <text x="444" y="234" font-size="14" font-family="ui-monospace, Consolas, monospace" fill="#2F2A26" xml:space="preserve">// pizza ist frei</text>
    <text x="530" y="292" text-anchor="middle" font-size="14" fill="#2F2A26">Pizzadichte abgeschafft</text>
    <text x="530" y="316" text-anchor="middle" font-size="14" fill="#2F2A26">Klein, rund, lesbar</text>
  </g>
</svg>
