<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 240" font-family="system-ui, sans-serif" role="img" aria-labelledby="t">
  <title id="t">Eine Variable ist ein beschrifteter Karton: Inhalt kann ausgetauscht werden, karton heißt leer</title>
  <defs>
    <marker id="pfeil" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#2F2A26"/>
    </marker>
  </defs>
  <g text-anchor="middle" fill="#2F2A26">
    <!-- Karton 1 -->
    <rect x="35" y="40" width="150" height="110" rx="10" fill="#E8C48A" stroke="#C8955A" stroke-width="3"/>
    <rect x="55" y="52" width="110" height="50" rx="8" fill="#FFF6E0" stroke="#E6D3A8" stroke-width="2"/>
    <text x="110" y="86" font-size="24" font-weight="bold">4</text>
    <text x="110" y="132" font-size="16" font-weight="bold">gäste</text>
    <text x="110" y="180" font-size="15">salami gäste = 4;</text>
    <text x="110" y="202" font-size="14">Karton mit Namen</text>

    <!-- Pfeil -->
    <line x1="190" y1="95" x2="240" y2="95" stroke="#2F2A26" stroke-width="3" marker-end="url(#pfeil)"/>

    <!-- Karton 2 -->
    <rect x="245" y="40" width="150" height="110" rx="10" fill="#E8C48A" stroke="#C8955A" stroke-width="3"/>
    <rect x="265" y="52" width="110" height="50" rx="8" fill="#FFF6E0" stroke="#E6D3A8" stroke-width="2"/>
    <text x="320" y="86" font-size="24" font-weight="bold">8</text>
    <text x="320" y="132" font-size="16" font-weight="bold">gäste</text>
    <text x="320" y="180" font-size="15">gäste = gäste * 2;</text>
    <text x="320" y="202" font-size="14">Inhalt ausgetauscht</text>

    <!-- Trenner -->
    <line x1="430" y1="30" x2="430" y2="215" stroke="#C8955A" stroke-width="2" stroke-dasharray="6 6"/>

    <!-- Karton 3: leer -->
    <rect x="455" y="40" width="150" height="110" rx="10" fill="#E8C48A" stroke="#C8955A" stroke-width="3"/>
    <rect x="475" y="52" width="110" height="50" rx="8" fill="none" stroke="#C8955A" stroke-width="2" stroke-dasharray="5 5"/>
    <text x="530" y="83" font-size="16" font-style="italic">leer</text>
    <text x="530" y="132" font-size="16" font-weight="bold">bestellung</text>
    <text x="530" y="180" font-size="15">bestellung = karton;</text>
    <text x="530" y="202" font-size="14" fill="#D9452B">leerer Karton (null)</text>
  </g>
</svg>
