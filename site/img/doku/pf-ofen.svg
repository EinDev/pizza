<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" font-family="system-ui, sans-serif" role="img" aria-labelledby="t">
  <title id="t">Ofen mit Zeitbudget: Der Block rechnet, merkt sich Zwischenstände und endet fertig, roh mit Teilergebnis oder verbrannt. Thermometer: höchstens 485 Grad</title>
  <g fill="#2F2A26">
    <!-- Ofen -->
    <rect x="150" y="40" width="26" height="34" rx="4" fill="#2F2A26"/>
    <rect x="30" y="70" width="180" height="150" rx="16" fill="#2F2A26"/>
    <path d="M60 190 L60 150 A60 40 0 0 1 180 150 L180 190 Z" fill="#F2B33D"/>
    <path d="M86 190 Q96 160 106 176 Q116 146 128 174 Q138 156 152 190 Z" fill="#D9452B"/>
    <rect x="52" y="190" width="136" height="8" rx="4" fill="#C8955A"/>
    <text x="120" y="248" font-size="14" text-anchor="middle">ofen(temperatur: 450,</text>
    <text x="120" y="268" font-size="14" text-anchor="middle">zeit: 90s) { … }</text>

    <!-- Thermometer -->
    <rect x="232" y="70" width="16" height="140" rx="8" fill="#FFFFFF" stroke="#2F2A26" stroke-width="2"/>
    <rect x="236" y="110" width="8" height="100" rx="4" fill="#D9452B"/>
    <circle cx="240" cy="214" r="13" fill="#D9452B" stroke="#2F2A26" stroke-width="2"/>
    <line x1="226" y1="84" x2="254" y2="84" stroke="#D9452B" stroke-width="3"/>
    <text x="260" y="80" font-size="14" font-weight="bold" fill="#D9452B">max 485 °C</text>

    <!-- Budget-Balken -->
    <text x="290" y="128" font-size="15" font-weight="bold">Zeitbudget</text>
    <text x="612" y="128" font-size="14" text-anchor="end">Zeit um!</text>
    <rect x="290" y="138" width="322" height="30" rx="10" fill="#FFF6E0" stroke="#2F2A26" stroke-width="2"/>
    <rect x="290" y="138" width="250" height="30" rx="10" fill="#F2B33D"/>
    <line x1="612" y1="132" x2="612" y2="174" stroke="#D9452B" stroke-width="3"/>
    <g fill="#3E8E41" stroke="#FFF6E0" stroke-width="2">
      <circle cx="340" cy="153" r="7"/>
      <circle cx="400" cy="153" r="7"/>
      <circle cx="460" cy="153" r="7"/>
      <circle cx="520" cy="153" r="7"/>
    </g>
    <text x="430" y="192" font-size="14" text-anchor="middle"><tspan fill="#3E8E41" font-weight="bold">●</tspan> zwischenstand(…) merkt Teilergebnis</text>
    <text x="290" y="222" font-size="14">Budget = zeit in ms × temperatur / 250</text>

    <!-- Ausgänge -->
    <circle cx="44" cy="288" r="8" fill="#3E8E41"/>
    <text x="60" y="293" font-size="15"><tspan font-weight="bold">fertig im Budget:</tspan> serviere ((wert)) liefert das Ergebnis</text>
    <circle cx="44" cy="314" r="8" fill="#F2B33D"/>
    <text x="60" y="319" font-size="15"><tspan font-weight="bold">Zeit um:</tspan> roh (r) bekommt r.teilergebnis()</text>
    <circle cx="44" cy="340" r="8" fill="#D9452B"/>
    <text x="60" y="345" font-size="15"><tspan font-weight="bold">zu heiß oder Ananas:</tspan> verbrannt (…)</text>
  </g>
</svg>
