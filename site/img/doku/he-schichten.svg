<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="640" height="360" font-family="system-ui, sans-serif" role="img">
  <title>Die drei Schichten des Herds: oben dein pizza-Programm (im Interpreter, als Wasm oder als EXE). Darunter der Herd-Kern mit Teilen, Komponenten und Systemen – eine neue Komponente ist eine Rust-Datei plus eine Zeile in der Liste. Ganz unten die Glut, die das Bildpaket auf der Grafikkarte zeichnet (WebGPU, WebGL2, DirectX, Vulkan).</title>

  <!-- Programm -->
  <rect x="40" y="20" width="560" height="78" rx="14" fill="#2F2A26"/>
  <text x="320" y="50" text-anchor="middle" font-size="17" font-weight="700" fill="#F2B33D">dein pizza-Programm</text>
  <text x="320" y="76" text-anchor="middle" font-size="14" fill="#FFF6E0">Interpreter · Wasm im Browser · EXE – überall gleich (bitgleiche Szene)</text>

  <path d="M320,100 L320,124" stroke="#2F2A26" stroke-width="3" stroke-linecap="round"/>
  <path d="M312,118 L320,128 L328,118" fill="none" stroke="#2F2A26" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="336" y="118" font-size="13" fill="#2F2A26">Griffe und Änderungen (Zahlen, kein Text pro Bild)</text>

  <!-- Kern -->
  <rect x="40" y="130" width="560" height="130" rx="14" fill="#E8C48A" stroke="#C8955A" stroke-width="3"/>
  <text x="62" y="158" font-size="17" font-weight="700" fill="#2F2A26">Herd-Kern</text>
  <text x="62" y="178" font-size="13" fill="#2F2A26">Welt: Teile, Lage, Hierarchie, Formen, Bildchen</text>
  <g font-size="14" font-weight="700" fill="#2F2A26">
    <rect x="62" y="192" width="84" height="32" rx="16" fill="#FFF6E0" stroke="#E6D3A8" stroke-width="2"/><text x="104" y="213" text-anchor="middle">Kreis</text>
    <rect x="154" y="192" width="84" height="32" rx="16" fill="#FFF6E0" stroke="#E6D3A8" stroke-width="2"/><text x="196" y="213" text-anchor="middle">Koerper</text>
    <rect x="246" y="192" width="84" height="32" rx="16" fill="#FFF6E0" stroke="#E6D3A8" stroke-width="2"/><text x="288" y="213" text-anchor="middle">Licht</text>
    <rect x="338" y="192" width="96" height="32" rx="16" fill="#FFF6E0" stroke="#E6D3A8" stroke-width="2"/><text x="386" y="213" text-anchor="middle">Bewegung</text>
    <rect x="442" y="192" width="64" height="32" rx="16" fill="#FFF6E0" stroke="#E6D3A8" stroke-width="2"/><text x="474" y="213" text-anchor="middle">…</text>
    <rect x="514" y="192" width="70" height="32" rx="16" fill="#3E8E41" stroke="#2F2A26" stroke-width="2"/><text x="549" y="213" text-anchor="middle" fill="#FFF6E0">neu!</text>
  </g>
  <text x="62" y="248" font-size="13" fill="#2F2A26">Komponenten: Schema, Speicher, System · neue Komponente = eine Rust-Datei + eine Zeile</text>

  <path d="M320,262 L320,286" stroke="#2F2A26" stroke-width="3" stroke-linecap="round"/>
  <path d="M312,280 L320,290 L328,280" fill="none" stroke="#2F2A26" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="336" y="280" font-size="13" fill="#2F2A26">ein Bildpaket je Bild</text>

  <!-- Glut -->
  <rect x="40" y="292" width="560" height="56" rx="14" fill="#D9452B" stroke="#2F2A26" stroke-width="3"/>
  <text x="62" y="318" font-size="17" font-weight="700" fill="#FFF6E0">Glut</text>
  <text x="62" y="338" font-size="13" fill="#FFF6E0">zeichnet auf der Grafikkarte: WebGPU/WebGL2 im Browser, DirectX/Vulkan nativ</text>
  <g fill="#F5C518"><path d="M560,336 C548,322 556,312 562,304 C562,316 574,318 570,330 C568,336 564,338 560,336 z"/><path d="M580,338 C572,330 578,322 582,318 C582,326 590,328 586,334 z"/></g>
</svg>
