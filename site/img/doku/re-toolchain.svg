<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="640" height="360" font-family="system-ui, sans-serif" role="img">
  <title>Toolchain: Quelltext .pizza geht in den Ofen (pizzaiolo backe, pizzaofen), heraus kommt ein .pkarton; der pizzabote liefert Zutaten</title>
  <defs>
    <marker id="pfeil" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#2F2A26"/>
    </marker>
  </defs>

  <!-- Stempel -->
  <rect x="200" y="10" width="240" height="30" rx="15" fill="none" stroke="#D9452B" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="320" y="31" text-anchor="middle" font-size="15" font-weight="700" fill="#D9452B">Nur Spezifikation (Tier 3)</text>

  <!-- 1. Quelltext -->
  <path d="M24,62 H112 L136,86 V180 H24 z" fill="#FFF6E0" stroke="#E6D3A8" stroke-width="3" stroke-linejoin="round"/>
  <path d="M112,62 V86 H136" fill="none" stroke="#E6D3A8" stroke-width="3" stroke-linejoin="round"/>
  <g stroke="#C8955A" stroke-width="2" stroke-linecap="round">
    <line x1="38" y1="100" x2="100" y2="100"/>
    <line x1="38" y1="112" x2="118" y2="112"/>
    <line x1="38" y1="124" x2="90" y2="124"/>
  </g>
  <text x="80" y="152" text-anchor="middle" font-size="15" font-weight="700" fill="#2F2A26">Pizzeria</text>
  <text x="80" y="170" text-anchor="middle" font-size="15" font-weight="700" fill="#2F2A26">.pizza</text>
  <text x="80" y="204" text-anchor="middle" font-size="14" fill="#2F2A26">Quelltext</text>

  <line x1="144" y1="122" x2="176" y2="122" stroke="#2F2A26" stroke-width="3" marker-end="url(#pfeil)"/>

  <!-- 2. Ofen -->
  <path d="M184,180 V122 A86,62 0 0 1 356,122 V180 z" fill="#2F2A26" stroke="#2F2A26" stroke-width="3" stroke-linejoin="round"/>
  <path d="M236,180 V150 A34,26 0 0 1 304,150 V180 z" fill="#F2B33D"/>
  <path d="M252,180 Q256,160 264,172 Q270,152 278,172 Q284,160 288,180 z" fill="#D9452B"/>
  <text x="270" y="110" text-anchor="middle" font-size="15" font-weight="700" fill="#FFF6E0">pizzaiolo backe</text>
  <text x="270" y="204" text-anchor="middle" font-size="14" fill="#2F2A26">Compiler · pizzaofen baut</text>

  <line x1="364" y1="122" x2="396" y2="122" stroke="#2F2A26" stroke-width="3" marker-end="url(#pfeil)"/>

  <!-- 3. Karton -->
  <rect x="404" y="76" width="110" height="104" rx="6" fill="#E8C48A" stroke="#C8955A" stroke-width="3"/>
  <line x1="404" y1="98" x2="514" y2="98" stroke="#C8955A" stroke-width="3"/>
  <text x="459" y="146" text-anchor="middle" font-size="17" font-weight="700" fill="#2F2A26">.pkarton</text>
  <text x="459" y="204" text-anchor="middle" font-size="14" fill="#2F2A26">Archiv (.jar)</text>

  <line x1="522" y1="122" x2="548" y2="122" stroke="#2F2A26" stroke-width="3" marker-end="url(#pfeil)"/>

  <!-- 4. fertige Pizza -->
  <circle cx="590" cy="122" r="36" fill="#E8C48A" stroke="#C8955A" stroke-width="3"/>
  <circle cx="590" cy="122" r="27" fill="#D9452B"/>
  <circle cx="580" cy="114" r="7" fill="#FFF6E0"/>
  <circle cx="598" cy="130" r="7" fill="#FFF6E0"/>
  <circle cx="598" cy="111" r="4" fill="#3E8E41"/>
  <text x="590" y="204" text-anchor="middle" font-size="14" fill="#2F2A26">fertig</text>

  <!-- pizzabote -->
  <rect x="150" y="270" width="78" height="52" rx="8" fill="#D9452B" stroke="#2F2A26" stroke-width="2"/>
  <text x="189" y="301" text-anchor="middle" font-size="14" font-weight="700" fill="#FFF6E0">Zutaten</text>
  <path d="M228,312 H262 L272,292 H286" fill="none" stroke="#2F2A26" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <line x1="140" y1="322" x2="268" y2="322" stroke="#2F2A26" stroke-width="3" stroke-linecap="round"/>
  <circle cx="162" cy="330" r="12" fill="#2F2A26"/>
  <circle cx="162" cy="330" r="5" fill="#E6D3A8"/>
  <circle cx="256" cy="330" r="12" fill="#2F2A26"/>
  <circle cx="256" cy="330" r="5" fill="#E6D3A8"/>
  <path d="M200,264 C200,250 240,254 240,240" fill="none" stroke="#3E8E41" stroke-width="3" marker-end="url(#pfeil)"/>

  <text x="310" y="292" font-size="16" font-weight="700" fill="#2F2A26">pizzabote hol extra-käse</text>
  <text x="310" y="314" font-size="14" fill="#2F2A26">liefert Zutaten (Abhängigkeiten) zum Ofen</text>
</svg>
