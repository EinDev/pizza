<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" font-family="system-ui, sans-serif" role="img" aria-labelledby="t">
  <title id="t">Vererbung als Stammbaum: Margherita und Diavolo erben alles von Pizza und legen Eigenes obendrauf</title>

  <!-- Eltern -->
  <rect x="240" y="32" width="160" height="58" rx="12" fill="#E8C48A" stroke="#C8955A" stroke-width="3"/>
  <text x="320" y="57" font-size="18" font-weight="bold" text-anchor="middle" fill="#2F2A26">Pizza</text>
  <text x="320" y="78" font-size="14" text-anchor="middle" fill="#2F2A26">Teig, backen()</text>

  <!-- Verbindungen (Pfeil zeigt zum Elternteil) -->
  <polygon points="320,92 309,108 331,108" fill="#FFF6E0" stroke="#2F2A26" stroke-width="2" stroke-linejoin="round"/>
  <g stroke="#2F2A26" stroke-width="3" fill="none">
    <polyline points="320,108 320,130"/>
    <polyline points="170,180 170,130 470,130 470,180"/>
  </g>
  <text x="180" y="162" font-size="14" font-weight="bold" fill="#D9452B">erbt</text>
  <text x="480" y="162" font-size="14" font-weight="bold" fill="#D9452B">erbt</text>

  <!-- Kinder -->
  <rect x="70" y="180" width="200" height="82" rx="12" fill="#FFF6E0" stroke="#E6D3A8" stroke-width="3"/>
  <text x="170" y="206" font-size="17" font-weight="bold" text-anchor="middle" fill="#2F2A26">Margherita</text>
  <text x="170" y="228" font-size="14" text-anchor="middle" fill="#2F2A26">Teig, backen()</text>
  <text x="170" y="249" font-size="14" font-weight="bold" text-anchor="middle" fill="#3E8E41">+ Basilikum</text>

  <rect x="370" y="180" width="200" height="82" rx="12" fill="#FFF6E0" stroke="#E6D3A8" stroke-width="3"/>
  <text x="470" y="206" font-size="17" font-weight="bold" text-anchor="middle" fill="#2F2A26">Diavolo</text>
  <text x="470" y="228" font-size="14" text-anchor="middle" fill="#2F2A26">Teig, backen()</text>
  <text x="470" y="249" font-size="14" font-weight="bold" text-anchor="middle" fill="#D9452B">+ Chili</text>

  <!-- Erklärung -->
  <text x="320" y="300" font-size="15" text-anchor="middle" fill="#2F2A26">Kinder bekommen alles von oben – und legen Eigenes drauf.</text>
  <text x="320" y="325" font-size="14" text-anchor="middle" fill="#2F2A26">unten( … ) ruft den Eltern-Teil auf (die Basis liegt unten)</text>
</svg>
