<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="640" height="360" font-family="system-ui, sans-serif" role="img">
  <title>Kassenbon der Exit-Codes: 0 gegessen, 1 ungefangene Ananas, 2 PizzaFehler, 3 noch im Ofen, 39 Hawaii</title>
  <defs>
    <g id="ananas">
      <path d="M-7,-12 L-10,-24 L-3,-16 L0,-27 L3,-16 L10,-24 L7,-12 z" fill="#3E8E41" stroke="#3E8E41" stroke-width="2" stroke-linejoin="round"/>
      <ellipse cx="0" cy="2" rx="11" ry="14" fill="#F5C518" stroke="#C8955A" stroke-width="2"/>
      <path d="M-8,-6 L6,10 M-2,-12 L10,2 M-10,2 L0,14 M8,-6 L-6,10 M2,-12 L-10,2 M10,2 L0,14" stroke="#C8955A" stroke-width="1.5" fill="none"/>
    </g>
  </defs>

  <!-- Bon -->
  <path d="M110,16 H530 V334 L516,346 L502,334 L488,346 L474,334 L460,346 L446,334 L432,346 L418,334 L404,346 L390,334 L376,346 L362,334 L348,346 L334,334 L320,346 L306,334 L292,346 L278,334 L264,346 L250,334 L236,346 L222,334 L208,346 L194,334 L180,346 L166,334 L152,346 L138,334 L124,346 L110,334 z"
        fill="#FFF6E0" stroke="#E6D3A8" stroke-width="2" stroke-linejoin="round"/>
  <text x="320" y="46" text-anchor="middle" font-size="17" font-weight="700" fill="#2F2A26">KASSENBON · Exit-Code</text>
  <line x1="130" y1="62" x2="510" y2="62" stroke="#C8955A" stroke-width="2" stroke-dasharray="6 5"/>

  <!-- 0: gegessen -->
  <circle cx="150" cy="96" r="16" fill="#3E8E41"/>
  <path d="M142,96 L148,102 L159,90" fill="none" stroke="#FFF6E0" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="200" y="104" text-anchor="middle" font-size="22" font-weight="700" fill="#2F2A26">0</text>
  <text x="240" y="102" font-size="16" fill="#2F2A26">gegessen – alles gut</text>

  <!-- 1: Ananas -->
  <use href="#ananas" x="150" y="148"/>
  <text x="200" y="152" text-anchor="middle" font-size="22" font-weight="700" fill="#2F2A26">1</text>
  <text x="240" y="150" font-size="16" fill="#2F2A26">ungefangene Ananas</text>

  <!-- 2: PizzaFehler -->
  <circle cx="150" cy="192" r="16" fill="#D9452B"/>
  <path d="M143,185 L157,199 M157,185 L143,199" stroke="#FFF6E0" stroke-width="3" stroke-linecap="round"/>
  <text x="200" y="200" text-anchor="middle" font-size="22" font-weight="700" fill="#2F2A26">2</text>
  <text x="240" y="198" font-size="16" fill="#2F2A26">PizzaFehler (z. B. Syntax)</text>

  <!-- 3: noch im Ofen -->
  <path d="M132,256 V236 A18,18 0 0 1 168,236 V256 z" fill="#2F2A26"/>
  <path d="M140,256 V244 A10,9 0 0 1 160,244 V256 z" fill="#F2B33D"/>
  <text x="200" y="248" text-anchor="middle" font-size="22" font-weight="700" fill="#2F2A26">3</text>
  <text x="240" y="246" font-size="16" fill="#2F2A26">noch im Ofen (Schrittlimit)</text>

  <!-- 39: Hawaii -->
  <circle cx="150" cy="288" r="17" fill="#E8C48A" stroke="#C8955A" stroke-width="2"/>
  <circle cx="150" cy="288" r="12" fill="#D9452B"/>
  <rect x="142" y="281" width="6" height="6" rx="1" fill="#F5C518" stroke="#C8955A" stroke-width="1"/>
  <rect x="152" y="289" width="6" height="6" rx="1" fill="#F5C518" stroke="#C8955A" stroke-width="1"/>
  <rect x="143" y="292" width="5" height="5" rx="1" fill="#F5C518" stroke="#C8955A" stroke-width="1"/>
  <text x="200" y="296" text-anchor="middle" font-size="22" font-weight="700" fill="#D9452B">39</text>
  <text x="240" y="294" font-size="16" fill="#2F2A26">Hawaii – der Pizzaiolo geht</text>

  <line x1="130" y1="312" x2="510" y2="312" stroke="#C8955A" stroke-width="2" stroke-dasharray="6 5"/>
  <text x="320" y="330" text-anchor="middle" font-size="14" fill="#2F2A26">Warnungen ändern den Exit-Code nie.</text>
</svg>
