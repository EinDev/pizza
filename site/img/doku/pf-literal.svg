<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" font-family="system-ui, sans-serif" role="img" aria-labelledby="t">
  <title id="t">Ein Pizza-Literal wird von unten nach oben geschichtet: Teig, Tomate, Mozzarella, Basilikum. Preis 5,00 + 1,00 + 1,50 + 0,50 = 8,00 Euro</title>
  <defs>
    <marker id="pfeil" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#2F2A26"/>
    </marker>
  </defs>
  <g fill="#2F2A26">
    <!-- Literal -->
    <text x="320" y="38" font-size="22" font-weight="bold" text-anchor="middle">((<tspan fill="#D9452B">Tomate</tspan>, <tspan fill="#C8955A">Mozzarella</tspan>, <tspan fill="#3E8E41">Basilikum</tspan>))</text>
    <text x="320" y="66" font-size="15" text-anchor="middle">links im Code = unten auf der Pizza, rechts im Code = oben</text>

    <!-- Pfeil unten nach oben -->
    <line x1="56" y1="262" x2="56" y2="146" stroke="#2F2A26" stroke-width="3" marker-end="url(#pfeil)"/>
    <text x="56" y="134" font-size="14" text-anchor="middle">oben</text>
    <text x="56" y="284" font-size="14" text-anchor="middle">unten</text>

    <!-- Schichten -->
    <rect x="80" y="230" width="240" height="36" rx="18" fill="#E8C48A" stroke="#C8955A" stroke-width="3"/>
    <rect x="92" y="198" width="216" height="28" rx="14" fill="#D9452B"/>
    <rect x="104" y="166" width="192" height="28" rx="14" fill="#FFF6E0" stroke="#E6D3A8" stroke-width="3"/>
    <ellipse cx="150" cy="160" rx="16" ry="7" fill="#3E8E41"/>
    <ellipse cx="200" cy="157" rx="16" ry="7" fill="#3E8E41"/>
    <ellipse cx="250" cy="160" rx="16" ry="7" fill="#3E8E41"/>

    <!-- Preise -->
    <g font-size="15">
      <text x="332" y="152"><tspan font-weight="bold">Basilikum</tspan> + 0,50 €</text>
      <text x="332" y="186"><tspan font-weight="bold">Mozzarella</tspan> + 1,50 €</text>
      <text x="332" y="218"><tspan font-weight="bold">Tomate</tspan> + 1,00 €</text>
      <text x="332" y="254"><tspan font-weight="bold">Teig</tspan> 5,00 €</text>
    </g>

    <!-- Summe -->
    <rect x="500" y="150" width="124" height="110" rx="14" fill="#FFF6E0" stroke="#F2B33D" stroke-width="3"/>
    <text x="562" y="180" font-size="15" text-anchor="middle">Summe</text>
    <text x="562" y="220" font-size="28" font-weight="bold" text-anchor="middle">8,00 €</text>
    <text x="562" y="246" font-size="14" text-anchor="middle">p.preis()</text>

    <!-- Hinweis -->
    <rect x="40" y="296" width="560" height="44" rx="12" fill="none" stroke="#C8955A" stroke-width="2" stroke-dasharray="6 6"/>
    <text x="320" y="324" font-size="15" text-anchor="middle">p + Salami ergibt eine neue Pizza. p selbst bleibt, wie es ist.</text>
  </g>
</svg>
