    <rect x="326" y="43" width="302" height="62" rx="12" fill="#FFF6E0" stroke="#E6D3A8" stroke-width="2"/>
    <rect x="338" y="66" width="18" height="16" rx="3" fill="none" stroke="#C8955A" stroke-width="2" stroke-dasharray="3 3"/>
