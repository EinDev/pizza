    <text x="390" y="209" font-size="16" font-weight="bold">Lieferung</text>
    <text x="390" y="231" font-size="14">Futures mit Zeitlimit</text>

    <rect x="326" y="253" width="302" height="62" rx="12" fill="#FFF6E0" stroke="#E6D3A8" stroke-width="2"/>
