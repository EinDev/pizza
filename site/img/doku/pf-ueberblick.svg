      <rect x="39" y="306" width="14" height="10" rx="4"/>
      <rect x="55" y="306" width="14" height="10" rx="4"/>
    </g>
    <text x="76" y="314" font-size="16" font-weight="bold">Küchenbrigade</text>
    <text x="76" y="336" font-size="14">echte Parallelität, nur lesen</text>

